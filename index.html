<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ELSEWHERE</title>

<style>
:root{--ink:#111;--muted:#888;--line:#eaeaea;--soft:#f9f9f9;--white:#fff;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--white);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
button,input,textarea{font:inherit;color:inherit;font-size:16px !important;}
button{cursor:pointer;touch-action:manipulation;border:none;background:none;}
input:focus, textarea:focus, button:focus { outline: none; }

/* 3D 翻书 */
#loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
#loader.fade-out { opacity: 0; pointer-events: none; }
.book-wrap { perspective: 1200px; margin-bottom: 20px; }
.book-3d { width: 50px; height: 70px; position: relative; transform-style: preserve-3d; background: #fff; border: 2px solid var(--ink); border-radius: 4px; }
.book-page { position: absolute; top: -2px; left: 50%; width: 100%; height: calc(100% + 4px); background: #fff; border: 2px solid var(--ink); border-radius: 4px; transform-origin: left center; animation: realFlip 2s infinite cubic-bezier(0.4, 0, 0.2, 1); }
@keyframes realFlip { 0% { transform: rotateY(0deg); } 25% { transform: rotateY(0deg); } 75% { transform: rotateY(-180deg); } 100% { transform: rotateY(-180deg); } }
.loader-text { font-size: 12px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }

/* 日历过渡 */
#calendarOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s ease; padding: 40px; }
#calendarOverlay.fade-out { opacity: 0; pointer-events: none; }
.cal-month-year { font-size: 13px; letter-spacing: 0.3em; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; }
.cal-day { font-size: 80px; font-weight: 800; line-height: 1; letter-spacing: -0.05em; margin-bottom: 20px; }
.cal-festival { font-size: 15px; font-weight: 600; letter-spacing: 0.1em; margin-bottom: 50px; }
.cal-line { width: 30px; height: 1px; background: var(--ink); margin-bottom: 40px; }
.cal-quote { font-size: 16px; line-height: 2; color: #333; max-width: 280px; text-align: justify; }
.cal-author { font-size: 13px; color: var(--muted); margin-top: 15px; align-self: flex-end; }
.cal-tap { position: absolute; bottom: 40px; font-size: 12px; color: #aaa; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity: 0.3;} 50%{opacity: 1;} }

/* 主应用 */
.app { max-width: 680px; margin: 0 auto; min-height: 100vh; padding: 0 20px 100px; opacity: 0; transition: opacity 0.8s; }
.app.loaded { opacity: 1; }
.topbar { height: 72px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(10px); z-index: 100; margin-bottom: 20px; }
.brand { font-size: 16px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.top-actions { display: flex; gap: 15px; }
.plain-btn { font-size: 13px; color: var(--muted); padding: 5px; }
.main-tabs { display: flex; border-bottom: 1px solid var(--line); height: 50px; margin-bottom: 30px; }
.main-tab { flex: 1; font-size: 16px; font-weight: 600; color: var(--muted); position: relative; }
.main-tab.active { color: var(--ink); }
.main-tab.active::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--ink); }
.hero h1 { font-size: 32px; letter-spacing: -.05em; margin: 10px 0 15px; font-weight: 800; }
.hero p { font-size: 15px; color: #666; margin-bottom: 30px; }
.stats { display: flex; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 15px 0; margin-bottom: 20px; }
.stat { flex: 1; border-right: 1px solid var(--line); padding-left: 15px; }
.stat:first-child { padding-left: 0; border: none; }
.stat:last-child { border: none; }
.stat strong { display: block; font-size: 24px; font-weight: 800; }
.stat span { font-size: 12px; color: var(--muted); }
.search-bar { width: 100%; border: none; background: var(--soft); border-radius: 10px; padding: 12px 15px; margin-bottom: 20px; }
.entry { padding: 20px 0; border-bottom: 1px solid var(--line); }
.entry-date { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.entry-place { font-size: 20px; font-weight: 700; margin: 5px 0 10px; }
.entry-body { font-size: 15px; line-height: 1.8; white-space: pre-wrap; margin-bottom: 10px; }
.entry-tags { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 3px 8px; border-radius: 12px; }
.entry-actions { display: flex; gap: 15px; }
.entry-actions button { font-size: 12px; color: var(--muted); }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.form-input, .form-textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px 15px; background: var(--white); }
.form-textarea { min-height: 180px; resize: vertical; }
.mode-switch { display: flex; gap: 10px; margin-bottom: 20px; }
.mode-btn { flex: 1; padding: 10px; background: var(--soft); border-radius: 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
.mode-btn.active { background: var(--white); border: 1px solid var(--ink); color: var(--ink); }
.box-list { display: flex; flex-direction: column; }
.box-card { padding: 20px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.box-title { font-size: 18px; font-weight: 700; }
.box-desc { font-size: 13px; color: var(--muted); margin-top: 4px; }
.add-box-btn { padding: 20px 0; font-size: 16px; font-weight: 600; color: var(--muted); text-align: center; border-bottom: 1px solid var(--line); }
.box-header { display: flex; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.back-btn { font-size: 24px; margin-right: 10px; font-weight: 300; }
.box-title-input { font-size: 20px; font-weight: 700; border: none; background: transparent; width: 200px; padding: 0;}
.box-title-input:disabled { color: var(--ink); }
.box-title-input:not(:disabled) { border-bottom: 1px solid var(--ink); }
.core-imagine { margin-bottom: 30px; }
.core-input { width: 100%; border: none; background: var(--soft); border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 600; line-height: 1.6; resize: none; }
.core-input:focus { background: #f0f0f0; }
.thread-feed { display: flex; flex-direction: column; margin-bottom: 20px; }
.thread-item { position: relative; padding: 15px 0 15px 20px; border-left: 1px solid #e0e0e0; margin-left: 5px; }
.thread-item::before { content: ""; position: absolute; left: -4px; top: 22px; width: 7px; height: 7px; border-radius: 50%; background: var(--white); border: 1px solid var(--ink); cursor: pointer; transition: background 0.2s; }
.thread-item.selected::before { background: var(--ink); }
.thread-content-wrap { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.thread-text { font-size: 15px; line-height: 1.6; white-space: pre-wrap; flex: 1; }
.thread-date { font-size: 11px; color: var(--muted); white-space: nowrap; margin-top: 4px; }
.thread-img { max-width: 100%; border-radius: 8px; margin-top: 8px; border: 1px solid var(--line); }
.thread-edit-btn { font-size: 14px; color: #ccc; cursor: pointer; padding: 0 5px; display: none; margin-left: 5px; }
.thread-content-wrap:hover .thread-edit-btn { display: block; }
.thread-actions { display: flex; gap: 15px; margin-top: 10px; }
.thread-actions button { font-size: 12px; color: var(--muted); }
.add-detail { position: relative; padding-left: 20px; border-left: 1px solid transparent; margin-left: 5px; }
.add-textarea { width: 100%; border: none; background: var(--soft); font-size: 15px; resize: none; padding: 15px; min-height: 80px; border-radius: 12px; margin-bottom: 10px; }
.add-actions { display: flex; justify-content: space-between; align-items: center; }
.add-img-btn { font-size: 24px; color: var(--muted); cursor: pointer; }
.add-submit { background: var(--ink); color: var(--white); padding: 6px 16px; border-radius: 15px; font-size: 14px; font-weight: 600; }
.fab { position: fixed; right: 20px; bottom: 40px; width: 56px; height: 56px; background: var(--ink); border-radius: 50%; z-index: 800; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; transition: transform 0.1s, left 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
.fab:active { cursor: grabbing; transform: scale(0.95); }
.fab svg { width: 24px; height: 24px; fill: none; stroke: var(--white); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fab.hidden { display: none !important; }
.popup-menu { position: absolute; top: 130px; left: 50%; transform: translateX(-50%); background: var(--white); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); z-index: 200; display: none; flex-direction: column; padding: 8px; width: 200px; }
.popup-menu.show { display: flex; }
.popup-menu button { text-align: left; padding: 12px 15px; font-size: 16px; border-radius: 8px; font-weight: 500; }
.popup-menu button:hover { background: var(--soft); }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999; white-space: nowrap; }
.toast.show { opacity: 1; }
.hidden { display: none !important; }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9500; display: flex; align-items: center; justify-content: center; }
.modal-content { background: #fff; padding: 30px; border-radius: 16px; width: 90%; max-width: 340px; text-align: center; }
.welcome-input { width: 100%; border: none; border-bottom: 1px solid var(--ink); font-size: 20px; text-align: center; padding: 10px; margin-bottom: 20px; background: transparent; font-weight: 700; }
.gender-select { display: flex; gap: 15px; margin-bottom: 30px; justify-content: center; }
.gender-btn { padding: 8px 20px; border: 1px solid var(--line); border-radius: 20px; font-size: 15px; color: var(--muted); transition: all 0.2s; }
.gender-btn.active { border-color: var(--ink); color: var(--ink); background: var(--soft); }
</style>
</head>
<body>

<div id="welcomeOverlay" class="modal-overlay hidden">
  <div class="modal-content">
    <h2 style="margin-top:0;">欢迎来到别处</h2>
    <p style="color:var(--muted); font-size:14px; margin-bottom:20px;">这是一个脱离此刻的想象世界。</p>
    <input type="text" id="welcomeName" class="welcome-input" placeholder="你希望我怎么称呼你？" maxlength="10">
    <div class="gender-select">
      <button class="gender-btn" data-g="男">男</button>
      <button class="gender-btn" data-g="女">女</button>
      <button class="gender-btn active" data-g="Ta">无性别</button>
    </div>
    <button class="add-submit" id="welcomeBtn" style="width:100%; padding:12px; font-size:16px;">进入世界</button>
  </div>
</div>

<div id="profileOverlay" class="modal-overlay hidden">
  <div class="modal-content">
    <h2 style="margin-top:0;">修改档案</h2>
    <input type="text" id="profileName" class="welcome-input" placeholder="你希望我怎么称呼你？" maxlength="10">
    <div class="gender-select">
      <button class="gender-btn" data-g="男">男</button>
      <button class="gender-btn" data-g="女">女</button>
      <button class="gender-btn" data-g="Ta">无性别</button>
    </div>
    <button class="add-submit" id="saveProfileBtn" style="width:100%; padding:12px; font-size:16px;">保存修改</button>
  </div>
</div>

<div id="loader">
  <div class="book-wrap"><div class="book-3d"><div class="book-page"></div></div></div>
  <div class="loader-text">Life is Elsewhere</div>
</div>

<div id="calendarOverlay" class="hidden">
  <div class="cal-month-year" id="calMonth">OCTOBER 2026</div>
  <div class="cal-day" id="calDay">24</div>
  <div class="cal-festival" id="calFestival">宜记录，宜想象</div>
  <div class="cal-line"></div>
  <div class="cal-quote" id="calQuote">生活在别处。</div>
  <div class="cal-author" id="calAuthor">—— 米兰·昆德拉</div>
  <div class="cal-tap">轻触任意位置</div>
</div>

<div class="fab hidden" id="fabBtn">
  <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
</div>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">ELSEWHERE</div>
    <div class="top-actions">
      <button class="plain-btn" id="profileBtn">档案</button>
      <button class="plain-btn" id="exportBtn">导出</button>
      <button class="plain-btn" id="importBtn">导入</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </header>

  <nav class="main-tabs">
    <button class="main-tab active" data-view="diary">日记</button>
    <button class="main-tab" data-view="imagine">想象</button>
  </nav>

  <div id="diarySection">
    <div id="diarySubView">
      <div class="hero">
        <h1 id="greetingTitle">Ta在好好生活。</h1>
        <p>去过的地方，吃过的东西，走过的路，以及那些不必特别、但值得记下来的日子。</p>
      </div>
      
      <div class="stats">
        <div class="stat"><strong id="daysCount">0</strong><span>记录的日子</span></div>
        <div class="stat"><strong id="placesCount">0</strong><span>去过的地方</span></div>
        <div class="stat"><strong id="entriesCount">0</strong><span>留下的文字</span></div>
      </div>

      <input type="text" id="searchInput" class="search-bar" placeholder="搜索内容或日期">
      <div id="entriesList"></div>
    </div>

    <div id="writeSubView" class="hidden">
      <h2 id="formTitle" style="font-size:24px; margin-bottom:20px;">记下今天</h2>
      <form id="entryForm">
        <input type="hidden" id="entryId">
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="date" class="form-input" required>
        </div>

        <div class="mode-switch">
          <button type="button" class="mode-btn active" id="modeNormal">分栏填写</button>
          <button type="button" class="mode-btn" id="modeSmart">大段智能写</button>
        </div>

        <div id="normalInputs">
          <div class="form-group"><label>在哪里</label><input type="text" id="place" class="form-input" placeholder="家、公司、咖啡馆……"></div>
          <div class="form-group"><label>吃了什么</label><input type="text" id="food" class="form-input" placeholder="晚餐、甜点……"></div>
          <div class="form-group"><label>感觉</label><input type="text" id="mood" class="form-input" placeholder="平静、疲惫……"></div>
        </div>

        <div class="form-group">
          <label id="eventsLabel">发生了什么</label>
          <textarea id="events" class="form-textarea" placeholder="先随便写点什么……"></textarea>
        </div>

        <div style="display:flex; gap:10px;">
          <button type="submit" class="add-submit" style="padding:12px 24px; font-size:16px;">保存记录</button>
          <button type="button" class="plain-btn" id="backBtn" style="border:1px solid var(--line); border-radius:20px; padding:10px 20px;">返回</button>
        </div>
      </form>
    </div>
  </div>

  <div id="imagineSection" class="hidden">
    <div id="imagineHub">
      <div class="hero">
        <h1 id="imagineTitle">Ta的世界，不止现在。</h1>
        <p>在脑海中构建未来的居所、穿着、职业与爱好。把这些渴望收集起来。</p>
      </div>
      <div class="box-list" id="boxList"></div>
      <div class="add-box-btn" id="addBoxBtn">添加新想象</div>
    </div>

    <div id="boxDetail" class="hidden">
      <div class="box-header">
        <button class="back-btn" id="backToImagineHub">←</button>
        <input type="text" id="boxTitleInput" class="box-title-input" disabled>
        <span id="editBoxTitleBtn" style="font-size:12px; color:#ccc; margin-left:10px; cursor:pointer; display:none;">编辑</span>
      </div>
      
      <div class="core-imagine">
        <textarea id="coreInput" class="core-input" placeholder="写下核心想象……" rows="2"></textarea>
      </div>

      <div class="thread-feed" id="threadFeed"></div>

      <div class="add-detail">
        <textarea id="detailText" class="add-textarea" placeholder="添砖加瓦……"></textarea>
        <div class="add-actions">
          <label class="add-img-btn">
            +
            <input type="file" id="detailImage" accept="image/*" style="display:none;">
          </label>
          <button class="add-submit" id="addDetailBtn">发布</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="popup-menu" id="boxTypeMenu">
  <button data-type="房子">房子</button>
  <button data-type="衣柜">衣柜</button>
  <button data-type="职业">职业</button>
  <button data-type="爱好">爱好</button>
  <button data-type="远方">远方</button>
  <button data-type="创作">创作</button>
  <button data-type="custom">自定义……</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  // 启用 v8 版本，确保你看到的是全新的干净数据
  var KEY_DIARY = 'herLittleAtlas.entries.v8';
  var KEY_IMAGINE = 'herLittleAtlas.imagine.v8';
  var KEY_PROFILE = 'herLittleAtlas.profile.v8';
  var $ = function(id) { return document.getElementById(id); };

  var entries = [];
  var imagineBoxes = [];
  var userProfile = { name: 'Ta', gender: 'Ta' };
  var currentBoxId = null;
  var currentSearchQuery = '';
  var currentMode = 'normal';
  var selectedGender = 'Ta';

  // 预置的那篇安静的下雨天日记
  var presetEntry = {
    id: 'e-preset-rain',
    date: '2026-10-23',
    place: '家',
    food: '开心果蛋糕',
    mood: '安静',
    events: '下了一天的雨。早上起来之后给阳台的盆栽浇水，放了一些玉米在阳台栏杆上，十点左右来了两只灰鸰小鸟，在门口叽叽喳喳一会离开了。虽然雨一直在下但是并不大，我坐在落地窗前看了一会就回房间写作了。做了一套瑜伽之后，把昨天的衣服放去烘干，沉浸式听了会唱片，试着在录音室复刻了一段。录音室隔音很好，听不到窗外的落雨。\n\n下午在细细簌簌的雨里午休到自然醒，醒来的时候天色已暗。晚上吃了一角昨天采购冷藏的开心果蛋糕，跑步完喝了点酒，洗漱后去泡脚。泡完差不多九点就上床看书，今天在读《不能承受的生命之轻》，读得有些昏昏沉沉又睡过去了。是无比平常而安静的一天。'
  };

  var quotes = [
    { text: "生活在别处。", author: "—— 米兰·昆德拉" },
    { text: "去爱，去失去，去感受，去生活。", author: "—— 电影《时时刻刻》" },
    { text: "希望是本无所谓有，无所谓无的。这正如地上的路；其实地上本没有路，走的人多了，也便成了路。", author: "—— 鲁迅" },
    { text: "我们读诗写诗，并不是因为它们好玩，而是因为我们是人类的一份子。人类是充满激情的。", author: "—— 电影《死亡诗社》" },
    { text: "如果冬天来了，春天还会远吗？", author: "—— 雪莱" },
    { text: "对未来的真正慷慨，是把一切都献给现在。", author: "—— 加缪" }
  ];

  var boxPrompts = {
    '房子': '你理想中的房子在哪？户型多大？窗外是什么风景？',
    '衣柜': '你希望衣柜里装满什么样的衣服？极简还是复古？',
    '职业': '想象你未来的工作状态。你在做什么？给你带来什么感觉？',
    '爱好': '你想把时间花在什么事情上？想学什么新技能？',
    '远方': '你最想去哪座城市？那里有什么吸引你的？',
    '创作': '你想创作什么样的作品？画作、音乐、文字？',
    'default': '你想象中的它是什么样的呢？'

  // ================= 初始化 =================
  window.addEventListener('load', function() {
    try {
      // 强制检查并注入预置日记
      var d = localStorage.getItem(KEY_DIARY);
      entries = d ? JSON.parse(d) : [];
      
      var hasPreset = entries.some(function(e) { return e.id === 'e-preset-rain'; });
      if (!hasPreset) {
        entries.push(presetEntry);
        localStorage.setItem(KEY_DIARY, JSON.stringify(entries)); // 直接写入！
      }
      
      var p = localStorage.getItem(KEY_PROFILE);
      if (!p) {
        // 把预置日记直接显示在画面上（在遮罩层之下）

        renderDiary(); // 这就是让你看到 1 的关键！

      }

  // 首次欢迎

    btn.addEventListener('click', function() {
      document.querySelectorAll('#welcomeOverlay .gender-btn').forEach(b => b.classList.remove('active'));

    var name = $('welcomeName').value.trim();

    userProfile = { name: name, gender: selectedGender };

    $('welcomeOverlay').classList.add('hidden');
    $('loader').style.display = 'flex';
    startAppFlow();
  });

  // 修改档案
  $('profileBtn').addEventListener('click', function() {
    $('profileName').value = userProfile.name;
    document.querySelectorAll('#profileOverlay .gender-btn').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-g') === userProfile.gender);

  document.querySelectorAll('#profileOverlay .gender-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#profileOverlay .gender-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      selectedGender = this.getAttribute('data-g');

  });

  $('saveProfileBtn').addEventListener('click', function() {
    var name = $('profileName').value.trim();
    if (!name) { showToast('请填写称呼'); return; }
    userProfile = { name: name, gender: selectedGender };
    localStorage.setItem(KEY_PROFILE, JSON.stringify(userProfile));
    $('profileOverlay').classList.add('hidden');
    updatePronouns();
    showToast('档案已更新');

  // 代词联动
  function updatePronouns() {
    var pronoun = userProfile.gender === 'Ta' ? 'Ta' : userProfile.gender;
    var displayName = userProfile.name || pronoun;
    $('greetingTitle').textContent = displayName + '在好好生活。';
    $('imagineTitle').textContent = displayName + '的世界，不止现在。';

  function startAppFlow() {
    updatePronouns();
    setTimeout(function() {
      $('loader').classList.add('fade-out');
      setTimeout(function() {
        $('loader').style.display = 'none';
        showCalendar();

    }, 1500);

  // ================= 日历过渡 =================
  function showCalendar() {
    var d = new Date();
    var months = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
    $('calMonth').textContent = months[d.getMonth()] + " " + d.getFullYear();
    $('calDay').textContent = d.getDate();
    
    var m = d.getMonth() + 1;
    var day = d.getDate();
    var festival = "宜记录，宜想象";
    if (m === 10 && day === 24) festival = "霜降";
    if (m === 1 && day === 1) festival = "元旦";
    $('calFestival').textContent = festival;

    var q = quotes[Math.floor(Math.random() * quotes.length)];
    $('calQuote').textContent = q.text;
    $('calAuthor').textContent = q.author;

    var overlay = $('calendarOverlay');
    overlay.classList.remove('hidden');
    
    overlay.addEventListener('click', function() {
      overlay.classList.add('fade-out');
      setTimeout(function() {
        overlay.classList.add('hidden');
        $('app').classList.add('loaded');
        window.scrollTo(0, 0); 
        $('fabBtn').classList.remove('hidden');
        renderDiary();
      }, 1000);
    }, { once: true });
  }

  // ================= 数据保存 =================
  function saveDiary() { localStorage.setItem(KEY_DIARY, JSON.stringify(entries)); }
  function saveImagine() { localStorage.setItem(KEY_IMAGINE, JSON.stringify(imagineBoxes)); }
  
  var toastTimer = null;
  function showToast(t) {
    var el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2000);
  }

  // ================= 页面切换 =================
  document.querySelectorAll('.main-tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      if (this.getAttribute('data-view') === 'diary') {
        $('diarySection').classList.remove('hidden');
        $('imagineSection').classList.add('hidden');
      } else {
        $('diarySection').classList.add('hidden');
        $('imagineSection').classList.remove('hidden');
        backToImagineHub();
      }
    });
  });

  // ================= 日记渲染 =================
  function formatDate(s) {
    if (!s) return '';
    var d = new Date(s + 'T12:00:00');
    return d.toLocaleDateString('zh-CN', {year:'numeric', month:'long', day:'numeric'});
  }

  function renderDiary() {
    $('daysCount').textContent = entries.length;
    $('entriesCount').textContent = entries.length;
    var places = new Set();
    entries.forEach(e => {
      if (e.place) e.place.split(/[·，,、]/).forEach(x => { if(x.trim()) places.add(x.trim()); });
    });
    $('placesCount').textContent = places.size;

    var filtered = entries.filter(function(e) {
      if (!currentSearchQuery) return true;
      var str = (e.date + ' ' + (e.place||'') + ' ' + (e.food||'') + ' ' + (e.mood||'') + ' ' + (e.events||'')).toLowerCase();
      return str.indexOf(currentSearchQuery) > -1;
    });

    filtered.sort((a,b) => b.date.localeCompare(a.date));

    var html = filtered.map(function(e) {
      var tags = '';
      if (e.food) tags += '<span class="tag">吃了 · ' + e.food + '</span>';
      if (e.mood) tags += '<span class="tag">感觉 · ' + e.mood + '</span>';
      
      return '<div class="entry">'
        + '<div class="entry-date">' + formatDate(e.date) + '</div>'
        + '<div class="entry-place">' + (e.place || '无题') + '</div>'
        + (tags ? '<div class="entry-tags">' + tags + '</div>' : '')
        + '<div class="entry-body">' + (e.events || '') + '</div>'
        + '<div class="entry-actions">'
        + '<button onclick="editEntry(\'' + e.id + '\')">编辑</button>'
        + '<button onclick="deleteEntry(\'' + e.id + '\')">删除</button>'
        + '</div></div>';
    }).join('');

    if (!html) html = '<div style="padding:40px 0; color:var(--muted); text-align:center;">没有记录</div>';
    $('entriesList').innerHTML = html;
  }

  $('searchInput').addEventListener('input', function(e) {
    currentSearchQuery = e.target.value.toLowerCase().trim();
    renderDiary();
  });

  $('fabBtn').addEventListener('click', function() {
    $('entryForm').reset();
    $('entryId').value = '';
    $('date').value = new Date().toISOString().split('T')[0];
    $('formTitle').textContent = '记下今天';
    $('diarySubView').classList.add('hidden');
    $('writeSubView').classList.remove('hidden');
    document.querySelector('.main-tab[data-view="diary"]').click();
  });

  $('backBtn').addEventListener('click', function() {
    $('writeSubView').classList.add('hidden');
    $('diarySubView').classList.remove('hidden');
  });

  function parseSmartText(text, currentObj) {
    if (!text.trim()) return currentObj;
    var lines = text.split('\n');
    var parsedPlace = currentObj.place; var parsedFood = currentObj.food; var parsedMood = currentObj.mood;
    var remainingLines = [];
    lines.forEach(line => {
      let trimmed = line.trim();
      if (!trimmed) return;
      if (!parsedPlace && (trimmed.includes('去了') || trimmed.includes('在') || trimmed.includes('到了'))) {
        let match = trimmed.match(/(去了|在|到了)([\u4e00-\u9fa5A-Za-z0-9·]{2,10})/);
        if (match && match[2]) { parsedPlace = match[2]; remainingLines.push(trimmed.replace(match[0], '')); return; }
      }
      if (!parsedFood && (trimmed.includes('吃了') || trimmed.includes('喝了') || trimmed.includes('点了'))) {
        let match = trimmed.match(/(吃了|喝了|点了)([\u4e00-\u9fa5A-Za-z0-9·]{2,10})/);
        if (match && match[2]) { parsedFood = match[2]; remainingLines.push(trimmed.replace(match[0], '')); return; }
      }
      if (!parsedMood && (trimmed.includes('感觉') || trimmed.includes('开心') || trimmed.includes('安静') || trimmed.includes('微醺'))) {
        let match = trimmed.match(/(感觉|觉得)([\u4e00-\u9fa5A-Za-z0-9·]{2,10})/);
        if (match && match[2]) { parsedMood = match[2]; remainingLines.push(trimmed.replace(match[0], '')); return; }
      }
      remainingLines.push(trimmed);
    });
    return { place: parsedPlace, food: parsedFood, mood: parsedMood, events: remainingLines.join('\n').trim() || text };
  }

  $('entryForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var id = $('entryId').value || ('e-' + Date.now());
    
    var finalPlace = $('place').value.trim();
    var finalFood = $('food').value.trim();
    var finalMood = $('mood').value.trim();
    var finalEvents = $('events').value.trim();

    if (currentMode === 'smart') {
      var parsed = parseSmartText(finalEvents, {place: finalPlace, food: finalFood, mood: finalMood});
      finalPlace = parsed.place || ''; finalFood = parsed.food || ''; finalMood = parsed.mood || ''; finalEvents = parsed.events;
    }

    var obj = {
      id: id, date: $('date').value, place: finalPlace, food: finalFood, mood: finalMood, events: finalEvents
    };
    
    var idx = entries.findIndex(x => x.id === id);
    if (idx > -1) entries[idx] = obj; else entries.push(obj);
    saveDiary(); renderDiary();
    $('backBtn').click();
    showToast('保存成功');
  });

  window.editEntry = function(id) {
    var e = entries.find(x => x.id === id);
    if (!e) return;
    $('entryId').value = e.id;
    $('date').value = e.date;
    $('place').value = e.place || '';
    $('food').value = e.food || '';
    $('mood').value = e.mood || '';
    $('events').value = e.events || '';
    $('formTitle').textContent = '编辑记录';
    $('diarySubView').classList.add('hidden');
    $('writeSubView').classList.remove('hidden');
    switchMode('normal');
  };

  window.deleteEntry = function(id) {
    if (!confirm('确定删除吗？')) return;
    entries = entries.filter(x => x.id !== id);
    saveDiary(); renderDiary();
  };

  function switchMode(mode) {
    currentMode = mode;
    if (mode === 'normal') {
      $('modeNormal').classList.add('active');
      $('modeSmart').classList.remove('active');
      $('normalInputs').style.display = 'block';
      $('eventsLabel').textContent = '发生了什么';
      $('events').placeholder = '先随便写点什么……';
    } else {
      $('modeNormal').classList.remove('active');
      $('modeSmart').classList.add('active');
      $('normalInputs').style.display = 'none';
      $('eventsLabel').textContent = '大段记录';
      $('events').placeholder = '在这里写下或者粘贴一大段话，保存时会自动拆分……';
    }
  }
  $('modeNormal').addEventListener('click', () => switchMode('normal'));
  $('modeSmart').addEventListener('click', () => switchMode('smart'));

  // ================= 想象渲染 =================
  function renderHub() {
    var html = imagineBoxes.map(function(box) {
      return '<div class="box-card" onclick="openBox(\'' + box.id + '\')">'
        + '<div><div class="box-title">' + box.name + '</div>'
        + '<div class="box-desc">' + (box.details ? box.details.length : 0) + ' 条补充</div></div>'
        + '<div style="font-size:18px; color:#ccc;">›</div></div>';
    }).join('');
    $('boxList').innerHTML = html;
  }

  window.openBox = function(id) {
    currentBoxId = id;
    var box = imagineBoxes.find(x => x.id === id);
    if (!box) return;

    $('imagineHub').classList.add('hidden');
    $('boxDetail').classList.remove('hidden');
    $('boxTitleInput').value = box.name;
    $('boxTitleInput').disabled = true;
    $('editBoxTitleBtn').style.display = 'none';
    
    if (box.type === 'custom') {
      $('editBoxTitleBtn').style.display = 'inline';
    }

    $('coreInput').value = box.core || '';
    var prompt = boxPrompts[box.name] || boxPrompts['default'];
    $('coreInput').placeholder = prompt;

    renderThreads(box);
  };

  function renderThreads(box) {
    var html = '';
    if (box.details && box.details.length > 0) {
      html = box.details.map(function(item, index) {
        var dateStr = item.date ? item.date.split('T')[0].replace(/-/g, '年').replace(/(\d+)月/, '$1月') + '日' : '';
        return '<div class="thread-item">'
          + '<div class="thread-content-wrap">'
          + '<div class="thread-text">' + item.text + '</div>'
          + '<div class="thread-date">' + dateStr + '</div>'
          + '<div class="thread-edit-btn" onclick="editThread(' + index + ')">编辑</div>'
          + '</div>'
          + (item.image ? '<img src="' + item.image + '" class="thread-img">' : '')
          + '<div class="thread-actions"><button onclick="delThread(' + index + ')">删除</button></div>'
          + '</div>';
      }).join('');
    }
    $('threadFeed').innerHTML = html;
  }

  window.editThread = function(index) {
    var box = imagineBoxes.find(x => x.id === currentBoxId);
    var item = box.details[index];
    var newText = prompt('修改内容：', item.text);
    if (newText !== null && newText.trim() !== '') {
      box.details[index].text = newText.trim();
      saveImagine();
      renderThreads(box);
    }
  };

  window.delThread = function(index) {
    if (!confirm('删除这条补充吗？')) return;
    var box = imagineBoxes.find(x => x.id === currentBoxId);
    box.details.splice(index, 1);
    saveImagine();
    renderThreads(box);
  };

  $('coreInput').addEventListener('blur', function() {
    var box = imagineBoxes.find(x => x.id === currentBoxId);
    if (box) { box.core = this.value; saveImagine(); }
  });

  $('addDetailBtn').addEventListener('click', function() {
    var text = $('detailText').value.trim();
    var file = $('detailImage').files[0];
    if (!text && !file) return;

    var proceed = function(imgData) {
      var box = imagineBoxes.find(x => x.id === currentBoxId);
      if (!box.details) box.details = [];
      var now = new Date();
      var dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
      box.details.push({ text: text, image: imgData || null, date: dateStr });
      saveImagine();
      $('detailText').value = '';
      $('detailImage').value = '';
      renderThreads(box);
    };

    if (file) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var scale = Math.min(1, 800 / Math.max(img.width, img.height));
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          proceed(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    } else {
      proceed(null);
    }
  });

  $('editBoxTitleBtn').addEventListener('click', function() {
    $('boxTitleInput').disabled = false;
    $('boxTitleInput').focus();
    this.style.display = 'none';
  });

  $('boxTitleInput').addEventListener('blur', function() {
    var box = imagineBoxes.find(x => x.id === currentBoxId);
    if (box) {
      box.name = this.value.trim() || box.name;
      this.value = box.name;
      saveImagine();
      this.disabled = true;
      if (box.type === 'custom') $('editBoxTitleBtn').style.display = 'inline';
    }

  $('backToImagineHub').addEventListener('click', backToImagineHub);
  function backToImagineHub() {
    $('boxDetail').classList.add('hidden');
    $('imagineHub').classList.remove('hidden');
    renderHub();
  }

  $('addBoxBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    $('boxTypeMenu').classList.toggle('show');
  });

  document.querySelectorAll('#boxTypeMenu button').forEach(btn => {
    btn.addEventListener('click', function() {
      var type = this.getAttribute('data-type');
      var boxName = type;
      if (type === 'custom') {
        boxName = '自定义';
      }
      if (imagineBoxes.find(x => x.name === boxName)) {
        showToast('这个盒子已经有了');
        $('boxTypeMenu').classList.remove('show');
        return;
      }
      var newBox = { id: 'box-' + Date.now(), type: type, name: boxName, core: '', details: [] };
      imagineBoxes.push(newBox);
      saveImagine();
      $('boxTypeMenu').classList.remove('show');
      renderHub();
      openBox(newBox.id);
    });
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('#addBoxBtn') && !e.target.closest('#boxTypeMenu')) {
      $('boxTypeMenu').classList.remove('show');
    }
  });

  // ================= 导入导出 =================
  $('exportBtn').addEventListener('click', function() {
    var data = { profile: userProfile, diary: entries, imagine: imagineBoxes };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '生活在别处_备份.json';
    a.click();
    showToast('导出成功');
  });

  $('importBtn').addEventListener('click', function() {
    $('importFile').click();
  });

  $('importFile').addEventListener('change', function(e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (confirm('导入将覆盖当前所有数据，确定吗？')) {
          if (data.profile) {
            userProfile = data.profile;
            localStorage.setItem(KEY_PROFILE, JSON.stringify(userProfile));
          }
          if (data.diary) {
            entries = data.diary;
          } else if (Array.isArray(data)) {
            entries = data;
          }
          if (data.imagine) {
            imagineBoxes = data.imagine;
          }
          
          saveDiary(); 
          saveImagine();
          
          showToast('导入成功，即将刷新');
          setTimeout(() => location.reload(), 1500);
        }
      } catch(err) { showToast('文件格式错误'); }
      e.target.value = '';
    };
    r.readAsText(f);
  });

  // ================= 拖拽悬浮球 =================
  var fab = $('fabBtn');
  var isDragging = false;
  var startX, startY, startLeft, startTop;

  fab.addEventListener('touchstart', startDrag, {passive: false});
  fab.addEventListener('mousedown', startDrag);

  function startDrag(e) {
    isDragging = false;
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    var rect = fab.getBoundingClientRect();
    startX = clientX; startY = clientY;
    startLeft = rect.left; startTop = rect.top;
    
    document.addEventListener('touchmove', onDrag, {passive: false});
    document.addEventListener('touchend', endDrag);
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
  }

  function onDrag(e) {
    if (!startX) return;
    e.preventDefault();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    var dx = clientX - startX;
    var dy = clientY - startY;
    
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isDragging = true;
    
    fab.style.left = (startLeft + dx) + 'px';
    fab.style.top = (startTop + dy) + 'px';
    fab.style.right = 'auto';
    fab.style.bottom = 'auto';
  }

  function endDrag() {
    document.removeEventListener('touchmove', onDrag);
    document.removeEventListener('touchend', endDrag);
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', endDrag);
    startX = null;
    
    var rect = fab.getBoundingClientRect();
    var vw = window.innerWidth;
    var targetLeft = rect.left + rect.width/2 > vw/2 ? vw - rect.width - 20 : 20;
    
    fab.style.left = targetLeft + 'px';
    fab.style.top = Math.max(20, Math.min(rect.top, window.innerHeight - rect.height - 20)) + 'px';
  }

  fab.addEventListener('click', function(e) {
    if (isDragging) {
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

})();
</script>
