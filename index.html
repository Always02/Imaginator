<style>
:root{--ink:#111;--muted:#888;--line:#eaeaea;--soft:#f9f9f9;--white:#fff;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--white);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
button,input,textarea{font:inherit;color:inherit;font-size:16px !important;} /* 锁定 16px 防止 Safari 放大 */
button{cursor:pointer;touch-action:manipulation;border:none;background:none;}
input:focus, textarea:focus, button:focus { outline: none; }

/* ====== 加载与日历 ====== */
#loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease; }
#loader.fade-out { opacity: 0; pointer-events: none; }
.book-wrap { perspective: 1200px; margin-bottom: 20px; }
.book-3d { width: 50px; height: 70px; position: relative; transform-style: preserve-3d; background: #fff; border: 2px solid var(--ink); border-radius: 2px; }
.book-page { position: absolute; top: -2px; left: 50%; width: 100%; height: calc(100% + 4px); background: #fff; border: 2px solid var(--ink); border-radius: 2px; transform-origin: left center; animation: realFlip 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1); }
@keyframes realFlip { 0% { transform: rotateY(0deg); } 20% { transform: rotateY(0deg); } 80% { transform: rotateY(-180deg); } 100% { transform: rotateY(-180deg); } }
.loader-text { font-size: 12px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }

#calendarOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s ease; padding: 40px; }
#calendarOverlay.fade-out { opacity: 0; pointer-events: none; }
.cal-month-year { font-size: 13px; letter-spacing: 0.3em; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; }
.cal-day { font-size: 80px; font-weight: 800; line-height: 1; letter-spacing: -0.05em; margin-bottom: 20px; }
.cal-festival { font-size: 15px; font-weight: 600; letter-spacing: 0.1em; margin-bottom: 50px; }
.cal-line { width: 30px; height: 1px; background: var(--ink); margin-bottom: 40px; }
.cal-quote { font-size: 16px; line-height: 2; color: #333; max-width: 280px; text-align: justify; }
.cal-author { font-size: 13px; color: var(--muted); margin-top: 15px; align-self: flex-end; }
.cal-tap { position: absolute; bottom: 40px; font-size: 12px; color: #aaa; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity: 0.3;} 50%{opacity: 1;} }

/* ====== 主应用 ====== */
.app { max-width: 680px; margin: 0 auto; min-height: 100vh; padding: 0 20px 100px; opacity: 0; transition: opacity 1s; }
.app.loaded { opacity: 1; }

.topbar { height: 72px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(10px); z-index: 100; margin-bottom: 20px; }
.brand { font-size: 16px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.top-actions { display: flex; gap: 15px; }
.plain-btn { font-size: 13px; color: var(--muted); padding: 5px; }

.main-tabs { display: flex; border-bottom: 1px solid var(--line); height: 50px; margin-bottom: 30px; }
.main-tab { flex: 1; font-size: 16px; font-weight: 600; color: var(--muted); position: relative; }
.main-tab.active { color: var(--ink); }
.main-tab.active::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--ink); }

/* 日记版块 */
.hero h1 { font-size: 32px; letter-spacing: -.05em; margin: 10px 0 15px; font-weight: 800; }
.hero p { font-size: 15px; color: #666; margin-bottom: 30px; }
.stats { display: flex; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 15px 0; margin-bottom: 20px; }
.stat { flex: 1; border-right: 1px solid var(--line); padding-left: 15px; }
.stat:first-child { padding-left: 0; border: none; }
.stat:last-child { border: none; }
.stat strong { display: block; font-size: 24px; font-weight: 800; }
.stat span { font-size: 12px; color: var(--muted); }
.search-bar { width: 100%; border: none; background: var(--soft); border-radius: 10px; padding: 12px 15px; margin-bottom: 20px; }

.entry { padding: 20px 0; border-bottom: 1px solid var(--line); }
.entry-date { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.entry-place { font-size: 20px; font-weight: 700; margin: 5px 0 10px; }
.entry-body { font-size: 15px; line-height: 1.8; white-space: pre-wrap; margin-bottom: 10px; }
.entry-tags { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 3px 8px; border-radius: 12px; }
.entry-actions { display: flex; gap: 15px; }
.entry-actions button { font-size: 12px; color: var(--muted); }

/* 写日记表单 */
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.form-input, .form-textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px 15px; background: var(--white); }
.form-textarea { min-height: 180px; resize: vertical; }
.mode-switch { display: flex; gap: 10px; margin-bottom: 20px; }
.mode-btn { flex: 1; padding: 10px; background: var(--soft); border-radius: 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
.mode-btn.active { background: var(--white); border: 1px solid var(--ink); color: var(--ink); }

/* 想象版块 */
.box-list { display: flex; flex-direction: column; }
.box-card { padding: 20px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.box-title { font-size: 18px; font-weight: 700; }
.box-desc { font-size: 13px; color: var(--muted); margin-top: 4px; }
.add-box-btn { padding: 20px 0; font-size: 16px; font-weight: 600; color: var(--muted); text-align: center; border-bottom: 1px solid var(--line); }

/* 盒子内部 */
.box-header { display: flex; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.back-btn { font-size: 24px; margin-right: 10px; font-weight: 300; }
.box-title-input { font-size: 20px; font-weight: 700; border: none; background: transparent; width: 200px; padding: 0;}
.box-title-input:disabled { color: var(--ink); }
.box-title-input:not(:disabled) { border-bottom: 1px solid var(--ink); }
.core-imagine { margin-bottom: 30px; }
.core-input { width: 100%; border: none; background: var(--soft); border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 600; line-height: 1.6; resize: none; }
.core-input:focus { background: #f0f0f0; }

/* 时间轴 */
.thread-feed { display: flex; flex-direction: column; margin-bottom: 20px; }
.thread-item { position: relative; padding: 15px 0 15px 20px; border-left: 1px solid #e0e0e0; margin-left: 5px; }
.thread-item::before { content: ""; position: absolute; left: -4px; top: 22px; width: 7px; height: 7px; border-radius: 50%; background: var(--white); border: 1px solid var(--ink); cursor: pointer; transition: background 0.2s; }
.thread-item.selected::before { background: var(--ink); }
.thread-content-wrap { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.thread-text { font-size: 15px; line-height: 1.6; white-space: pre-wrap; flex: 1; }
.thread-date { font-size: 11px; color: var(--muted); white-space: nowrap; margin-top: 4px; }
.thread-img { max-width: 100%; border-radius: 8px; margin-top: 8px; border: 1px solid var(--line); }
.thread-edit-btn { font-size: 14px; color: #ccc; cursor: pointer; padding: 0 5px; display: none; margin-left: 5px; }
.thread-content-wrap:hover .thread-edit-btn { display: block; }
.thread-actions { display: flex; gap: 15px; margin-top: 10px; }
.thread-actions button { font-size: 12px; color: var(--muted); }

.add-detail { position: relative; padding-left: 20px; border-left: 1px solid transparent; margin-left: 5px; }
.add-textarea { width: 100%; border: none; background: var(--soft); font-size: 15px; resize: none; padding: 15px; min-height: 80px; border-radius: 12px; margin-bottom: 10px; }
.add-actions { display: flex; justify-content: space-between; align-items: center; }
.add-img-btn { font-size: 24px; color: var(--muted); cursor: pointer; }
.add-submit { background: var(--ink); color: var(--white); padding: 6px 16px; border-radius: 15px; font-size: 14px; font-weight: 600; }

/* 悬浮球 */
.fab { position: fixed; right: 20px; bottom: 40px; width: 56px; height: 56px; background: var(--ink); border-radius: 50%; z-index: 800; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; transition: transform 0.1s, left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
.fab:active { cursor: grabbing; transform: scale(0.95); }
.fab svg { width: 24px; height: 24px; fill: none; stroke: var(--white); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fab.hidden { display: none !important; }

/* 弹窗与提示 */
.popup-menu { position: absolute; top: 130px; left: 50%; transform: translateX(-50%); background: var(--white); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); z-index: 200; display: none; flex-direction: column; padding: 8px; width: 200px; }
.popup-menu.show { display: flex; }
.popup-menu button { text-align: left; padding: 12px 15px; font-size: 16px; border-radius: 8px; font-weight: 500; }
.popup-menu button:hover { background: var(--soft); }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999; white-space: nowrap; }
.toast.show { opacity: 1; }
.hidden { display: none !important; }

/* 弹窗 */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9500; display: flex; align-items: center; justify-content: center; }
.modal-content { background: #fff; padding: 30px; border-radius: 16px; width: 90%; max-width: 340px; text-align: center; }
.welcome-input { width: 100%; border: none; border-bottom: 1px solid var(--ink); font-size: 20px; text-align: center; padding: 10px; margin-bottom: 20px; background: transparent; font-weight: 700; }
.gender-select { display: flex; gap: 15px; margin-bottom: 30px; justify-content: center; }
.gender-btn { padding: 8px 20px; border: 1px solid var(--line); border-radius: 20px; font-size: 15px; color: var(--muted); transition: all 0.2s; }
.gender-btn.active { border-color: var(--ink); color: var(--ink); background: var(--soft); }
</style>
</head>
<body>

<!-- 首次欢迎界面 -->
<div id="welcomeOverlay" class="modal-overlay hidden">
  <div class="modal-content">
    <h2 style="margin-top:0;">欢迎来到别处</h2>
    <p style="color:var(--muted); font-size:14px; margin-bottom:20px;">这是一个脱离此刻的想象世界。</p>
    <input type="text" id="welcomeName" class="welcome-input" placeholder="你希望我怎么称呼你？" maxlength="10">
    <div class="gender-select">
      <button class="gender-btn" data-g="男">男</button>
      <button class="gender-btn" data-g="女">女</button>
      <button class="gender-btn active" data-g="Ta">无性别</button>
    </div>
    <button class="add-submit" id="welcomeBtn" style="width:100%; padding:12px; font-size:16px;">进入世界</button>
  </div>
</div>

<!-- 修改档案界面 -->
<div id="profileOverlay" class="modal-overlay hidden">
  <div class="modal-content">
    <h2 style="margin-top:0;">修改档案</h2>
    <input type="text" id="profileName" class="welcome-input" placeholder="你希望我怎么称呼你？" maxlength="10">
    <div class="gender-select">
      <button class="gender-btn" data-g="男">男</button>
      <button class="gender-btn" data-g="女">女</button>
      <button class="gender-btn" data-g="Ta">无性别</button>
    </div>
    <button class="add-submit" id="saveProfileBtn" style="width:100%; padding:12px; font-size:16px;">保存修改</button>
  </div>
</div>

<!-- 加载动画 -->
<div id="loader">
  <div class="book-wrap"><div class="book-3d"><div class="book-page"></div></div></div>
  <div class="loader-text">Life is Elsewhere</div>
</div>

<!-- 日历过渡页 -->
<div id="calendarOverlay" class="hidden">
  <div class="cal-month-year" id="calMonth">OCTOBER 2026</div>
  <div class="cal-day" id="calDay">24</div>
  <div class="cal-festival" id="calFestival">宜记录，宜想象</div>
  <div class="cal-line"></div>
  <div class="cal-quote" id="calQuote">生活在别处。</div>
  <div class="cal-author" id="calAuthor">—— 米兰·昆德拉</div>
  <div class="cal-tap">轻触任意位置</div>
</div>

<!-- 悬浮球默认隐藏 -->
<div class="fab hidden" id="fabBtn">
  <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
</div>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">ELSEWHERE</div>
    <div class="top-actions">
      <button class="plain-btn" id="profileBtn">档案</button>
      <button class="plain-btn" id="exportBtn">导出</button>
      <button class="plain-btn" id="importBtn">导入</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </header>

  <nav class="main-tabs">
    <button class="main-tab active" data-view="diary">日记</button>
    <button class="main-tab" data-view="imagine">想象</button>
  </nav>

  <!-- 日记版块 -->
  <div id="diarySection">
    <div id="diarySubView">
      <div class="hero">
        <h1 id="greetingTitle">Ta在好好生活。</h1>
        <p>去过的地方，吃过的东西，走过的路，以及那些不必特别、但值得记下来的日子。</p>
      </div>
      
      <div class="stats">
        <div class="stat"><strong id="daysCount">0</strong><span>记录的日子</span></div>
        <div class="stat"><strong id="placesCount">0</strong><span>去过的地方</span></div>
        <div class="stat"><strong id="entriesCount">0</strong><span>留下的文字</span></div>
      </div>

      <input type="text" id="searchInput" class="search-bar" placeholder="搜索内容或日期">
      <div id="entriesList"></div>
    </div>

    <div id="writeSubView" class="hidden">
      <h2 id="formTitle" style="font-size:24px; margin-bottom:20px;">记下今天</h2>
      <form id="entryForm">
        <input type="hidden" id="entryId">
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="date" class="form-input" required>
        </div>

        <div class="mode-switch">
          <button type="button" class="mode-btn active" id="modeNormal">分栏填写</button>
          <button type="button" class="mode-btn" id="modeSmart">大段智能写</button>
        </div>

        <div id="normalInputs">
          <div class="form-group"><label>在哪里</label><input type="text" id="place" class="form-input" placeholder="家、公司、咖啡馆……"></div>
          <div class="form-group"><label>吃了什么</label><input type="text" id="food" class="form-input" placeholder="晚餐、甜点……"></div>
          <div class="form-group"><label>感觉</label><input type="text" id="mood" class="form-input" placeholder="平静、疲惫……"></div>
        </div>

        <div class="form-group">
          <label id="eventsLabel">发生了什么</label>
          <textarea id="events" class="form-textarea" placeholder="先随便写点什么……"></textarea>
        </div>

        <div style="display:flex; gap:10px;">
          <button type="submit" class="add-submit" style="padding:12px 24px; font-size:16px;">保存记录</button>
          <button type="button" class="plain-btn" id="backBtn" style="border:1px solid var(--line); border-radius:20px; padding:10px 20px;">返回</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 想象版块 -->
  <div id="imagineSection" class="hidden">
    <div id="imagineHub">
      <div class="hero">
        <h1 id="imagineTitle">Ta的世界，不止现在。</h1>
        <p>在脑海中构建未来的居所、穿着、职业与爱好。把这些渴望收集起来。</p>
      </div>
      <div class="box-list" id="boxList"></div>
      <div class="add-box-btn" id="addBoxBtn">添加新想象</div>
    </div>

    <div id="boxDetail" class="hidden">
      <div class="box-header">
        <button class="back-btn" id="backToImagineHub">←</button>
        <input type="text" id="boxTitleInput" class="box-title-input" disabled>
        <span id="editBoxTitleBtn" style="font-size:12px; color:#ccc; margin-left:10px; cursor:pointer; display:none;">编辑</span>
      </div>
      
      <div class="core-imagine">
        <textarea id="coreInput" class="core-input" placeholder="写下核心想象……" rows="2"></textarea>
      </div>

      <div class="thread-feed" id="threadFeed"></div>

      <div class="add-detail">
        <textarea id="detailText" class="add-textarea" placeholder="添砖加瓦……"></textarea>
        <div class="add-actions">
          <label class="add-img-btn">
            +
            <input type="file" id="detailImage" accept="image/*" style="display:none;">
          </label>
          <button class="add-submit" id="addDetailBtn">发布</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="popup-menu" id="boxTypeMenu">
  <button data-type="房子">房子</button>
  <button data-type="衣柜">衣柜</button>
  <button data-type="职业">职业</button>
  <button data-type="爱好">爱好</button>
  <button data-type="远方">远方</button>
  <button data-type="创作">创作</button>
  <button data-type="custom">自定义……</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var KEY_DIARY = 'herLittleAtlas.entries.v4';
  var KEY_IMAGINE = 'herLittleAtlas.imagine.v4';
  var KEY_PROFILE = 'herLittleAtlas.profile.v4';
  var $ = function(id) { return document.getElementById(id); };

  var entries = [];
  var imagineBoxes = [];
  var userProfile = { name: '', gender: 'Ta' };
  var currentBoxId = null;
  var currentSearchQuery = '';
  var currentMode = 'normal';
  var selectedGender = 'Ta';

  // 预置的那篇安静的下雨天日记
  var presetEntry = {
    id: 'e-preset-rain',
    date: '2026-10-23',
    place: '家',
    food: '开心果蛋糕',
    mood: '安静',
    events: '下了一天的雨。早上起来之后给阳台的盆栽浇水，放了一些玉米在阳台栏杆上，十点左右来了两只灰鸰小鸟，在门口叽叽喳喳一会离开了。虽然雨一直在下但是并不大，我坐在落地窗前看了一会就回房间写作了。做了一套瑜伽之后，把昨天的衣服放去烘干，沉浸式听了会唱片，试着在录音室复刻了一段。录音室隔音很好，听不到窗外的落雨。\n\n下午在细细簌簌的雨里午休到自然醒，醒来的时候天色已暗。晚上吃了一角昨天采购冷藏的开心果蛋糕，跑步完喝了点酒，洗漱后去泡脚。泡完差不多九点就上床看书，今天在读《不能承受的生命之轻》，读得有些昏昏沉沉又睡过去了。是无比平常而安静的一天。'
  };

  var quotes = [
    { text: "生活在别处。", author: "—— 米兰·昆德拉" },
    { text: "去爱，去失去，去感受，去生活。", author: "—— 电影《时时刻刻》" },
    { text: "希望是本无所谓有，无所谓无的。这正如地上的路；其实地上本没有路，走的人多了，也便成了路。", author: "—— 鲁迅" },

  window.addEventListener('load', function() {
    try {
      var p = localStorage.getItem(KEY_PROFILE) || localStorage.getItem('herLittleAtlas.profile.v3');
      if (!p) {
        $('loader').style.display = 'none';
        $('welcomeOverlay').classList.remove('hidden');
        return;
      }
      userProfile = JSON.parse(p);
      
      var d = localStorage.getItem(KEY_DIARY) || localStorage.getItem('herLittleAtlas.entries.v3');
      entries = d ? JSON.parse(d) : [];
      if (entries.length === 0) entries.push(presetEntry); // 如果没有数据，放进预置日记
      
      var i = localStorage.getItem(KEY_IMAGINE) || localStorage.getItem('herLittleAtlas.imagine.v3');
      imagineBoxes = i ? JSON.parse(i) : [];
    } catch(e) {}
    startAppFlow();
  });

  document.querySelectorAll('#welcomeOverlay .gender-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#welcomeOverlay .gender-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      selectedGender = this.getAttribute('data-g');
    });
  });

  $('welcomeBtn').addEventListener('click', function() {
    var name = $('welcomeName').value.trim();
    if (!name) { showToast('请填写称呼'); return; }
    userProfile = { name: name, gender: selectedGender };
    localStorage.setItem(KEY_PROFILE, JSON.stringify(userProfile));
    
    // 如果此时日记为空，推入预置日记
    if (entries.length === 0) {
      entries.push(presetEntry);
      saveDiary();
    }

    $('welcomeOverlay').classList.add('hidden');
    $('loader').style.display = 'flex';
    startAppFlow();

  $('profileBtn').addEventListener('click', function() {
    $('profileName').value = userProfile.name;
    document.querySelectorAll('#profileOverlay .gender-btn').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-g') === userProfile.gender);
    });
    selectedGender = userProfile.gender;
    $('profileOverlay').classList.remove('hidden');
  });

  document.querySelectorAll('#profileOverlay .gender-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#profileOverlay .gender-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      selectedGender = this.getAttribute('data-g');
    });
  });

  $('saveProfileBtn').addEventListener('click', function() {
    var name = $('profileName').value.trim();
    if (!name) { showToast('请填写称呼'); return; }
    userProfile = { name: name, gender: selectedGender };
    localStorage.setItem(KEY_PROFILE, JSON.stringify(userProfile));
    $('profileOverlay').classList.add('hidden');
    updatePronouns();
    showToast('档案已更新');
  });

  function updatePronouns() {
    var pronoun = userProfile.gender === 'Ta' ? 'Ta' : userProfile.gender;
    var displayName = userProfile.name || pronoun;
    $('greetingTitle').textContent = displayName + '在好好生活。';
    $('imagineTitle').textContent = displayName + '的世界，不止现在。';
  }

  function startAppFlow() {
    updatePronouns();
    setTimeout(function() {
      $('loader').classList.add('fade-out');
      setTimeout(function() {
        $('loader').style.display = 'none';
        showCalendar();
      }, 600);
    }, 2000);
  }
