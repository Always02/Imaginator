<style>
:root{--ink:#111;--muted:#888;--line:#eaeaea;--soft:#f9f9f9;--white:#fff;}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--white);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
button,input,textarea{font:inherit;color:inherit;font-size:16px !important;}
button{cursor:pointer;touch-action:manipulation;border:none;background:none;}
input:focus, textarea:focus, button:focus { outline: none; }

/* 3D 翻书 */
#loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
#loader.fade-out { opacity: 0; pointer-events: none; }
.book-wrap { perspective: 1200px; margin-bottom: 20px; }
.book-3d { width: 50px; height: 70px; position: relative; transform-style: preserve-3d; background: #fff; border: 2px solid var(--ink); border-radius: 4px; }
.book-page { position: absolute; top: -2px; left: 50%; width: 100%; height: calc(100% + 4px); background: #fff; border: 2px solid var(--ink); border-radius: 4px; transform-origin: left center; animation: realFlip 2s infinite cubic-bezier(0.4, 0, 0.2, 1); }
@keyframes realFlip { 0% { transform: rotateY(0deg); } 25% { transform: rotateY(0deg); } 75% { transform: rotateY(-180deg); } 100% { transform: rotateY(-180deg); } }
.loader-text { font-size: 12px; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }

/* 开场欢迎打字 */
#welcomeIntro { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); z-index: 9800; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.6s ease; }
#welcomeIntro.fade-out { opacity: 0; pointer-events: none; }
.intro-title { font-size: 28px; font-weight: 800; letter-spacing: 0.05em; text-align: center; min-height: 40px; }
.intro-title .cursor { display: inline-block; width: 2px; height: 1em; background: var(--ink); margin-left: 2px; vertical-align: -0.15em; animation: blink 0.8s infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
.intro-tap { margin-top: 40px; font-size: 13px; color: var(--muted); letter-spacing: 0.15em; opacity: 0; transition: opacity 0.8s; }
.intro-tap.show { opacity: 1; animation: pulse 2s infinite; }

/* 来信 */
#letterOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); z-index: 9700; display: flex; align-items: center; justify-content: center; padding: 30px; transition: opacity 0.5s ease; }
#letterOverlay.fade-out { opacity: 0; pointer-events: none; }
.letter-card { max-width: 380px; width: 100%; text-align: center; }
.letter-card h2 { margin: 0 0 26px; font-size: 13px; font-weight: 600; letter-spacing: 0.35em; color: var(--muted); }
.letter-card p { font-size: 16px; line-height: 2.2; color: #333; margin: 0 0 6px; }
.letter-actions { margin-top: 40px; text-align: center; }
.letter-ok { font-size: 16px; color: var(--ink); padding: 6px 12px; border-bottom: 1px solid transparent; }
.letter-ok:active { opacity: 0.5; }

/* 日历过渡 */
#calendarOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--white); z-index: 9000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s ease; padding: 40px; }
#calendarOverlay.fade-out { opacity: 0; pointer-events: none; }
.cal-month-year { font-size: 13px; letter-spacing: 0.3em; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; }
.cal-day { font-size: 80px; font-weight: 800; line-height: 1; letter-spacing: -0.05em; margin-bottom: 20px; }
.cal-festival { font-size: 15px; font-weight: 600; letter-spacing: 0.1em; margin-bottom: 50px; }
.cal-line { width: 30px; height: 1px; background: var(--ink); margin-bottom: 40px; }
.cal-quote { font-size: 16px; line-height: 2; color: #333; max-width: 280px; text-align: justify; }
.cal-author { font-size: 13px; color: var(--muted); margin-top: 15px; align-self: flex-end; }
.cal-tap { position: absolute; bottom: 40px; font-size: 12px; color: #aaa; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity: 0.3;} 50%{opacity: 1;} }

/* 主应用 */
.app { max-width: 680px; margin: 0 auto; min-height: 100vh; padding: 0 20px 100px; opacity: 0; transition: opacity 0.8s; }
.app.loaded { opacity: 1; }
.topbar { height: 72px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(10px); z-index: 100; margin-bottom: 20px; }
.brand { font-size: 16px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.top-actions { display: flex; gap: 15px; }
.plain-btn { font-size: 13px; color: var(--muted); padding: 5px; }
.main-tabs { display: flex; border-bottom: 1px solid var(--line); height: 50px; margin-bottom: 30px; }
.main-tab { flex: 1; font-size: 16px; font-weight: 600; color: var(--muted); position: relative; }
.main-tab.active { color: var(--ink); }
.main-tab.active::after { content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--ink); }
.hero h1 { font-size: 32px; letter-spacing: -.05em; margin: 10px 0 15px; font-weight: 800; }
.hero p { font-size: 15px; color: #666; margin-bottom: 30px; }
.stats { display: flex; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 15px 0; margin-bottom: 20px; }
.stat { flex: 1; border-right: 1px solid var(--line); padding-left: 15px; }
.stat:first-child { padding-left: 0; border: none; }
.stat:last-child { border: none; }
.stat strong { display: block; font-size: 24px; font-weight: 800; }
.stat span { font-size: 12px; color: var(--muted); }
.search-bar { width: 100%; border: none; background: var(--soft); border-radius: 10px; padding: 12px 15px; margin-bottom: 20px; }
.entry { padding: 20px 0; border-bottom: 1px solid var(--line); }
.entry-date { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.entry-place { font-size: 20px; font-weight: 700; margin: 5px 0 10px; }
.entry-body { font-size: 15px; line-height: 1.8; white-space: pre-wrap; margin-bottom: 10px; word-break: break-word; }
.entry-body a { color: #0066cc; text-decoration: underline; }
.entry-tags { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); padding: 3px 8px; border-radius: 12px; }
.entry-actions { display: flex; justify-content: flex-end; gap: 16px; }
.entry-actions button { font-size: 15px; color: var(--muted); }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.form-input, .form-textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px 15px; background: var(--white); }
.form-textarea { min-height: 180px; resize: vertical; }
.mode-switch { display: flex; gap: 10px; margin-bottom: 20px; }
.mode-btn { flex: 1; padding: 10px; background: var(--soft); border-radius: 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
.mode-btn.active { background: var(--white); border: 1px solid var(--ink); color: var(--ink); }
.box-list { display: flex; flex-direction: column; }
.box-card { padding: 20px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden; }
.box-title { font-size: 18px; font-weight: 700; color: var(--ink); }
.box-desc { font-size: 13px; color: var(--muted); margin-top: 4px; }
.add-box-btn { padding: 20px 0; font-size: 16px; font-weight: 600; color: var(--muted); text-align: center; border-bottom: 1px solid var(--line); }
.box-header { display: flex; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.back-btn { font-size: 24px; margin-right: 10px; font-weight: 300; }
.box-title-input { font-size: 20px; font-weight: 700; border: none; background: transparent; width: 200px; padding: 0; color: var(--ink);}
.box-title-input:disabled { color: var(--ink); }
.box-title-input:not(:disabled) { border-bottom: 1px solid var(--ink); }
/* 标题旁小灰笔 */
.title-pencil { font-size: 15px; color: #bbb; margin-left: 8px; cursor: pointer; user-select: none; }
/* core 引言感 */
.core-imagine { margin-bottom: 30px; position: relative; padding-left: 16px; }
.core-imagine::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; background: var(--ink); border-radius: 2px; }
.core-input { width: 100%; border: none; background: transparent; padding: 12px 4px; font-size: 17px; font-weight: 600; line-height: 1.8; resize: none; }
.core-input:focus { background: transparent; }
/* core 引导气泡 */
.core-bubble { position: absolute; left: 16px; top: -12px; transform: translateY(-100%); background: var(--ink); color: #fff; font-size: 12px; padding: 8px 12px; border-radius: 10px; white-space: nowrap; z-index: 5; }
.core-bubble::after { content: ""; position: absolute; left: 18px; bottom: -4px; width: 8px; height: 8px; background: var(--ink); transform: rotate(45deg); }
.thread-feed { display: flex; flex-direction: column; margin-bottom: 20px; }
.thread-item { position: relative; padding: 15px 0 15px 20px; border-left: 1px solid #e0e0e0; margin-left: 5px; }
.thread-item::before { content: ""; position: absolute; left: -4px; top: 22px; width: 7px; height: 7px; border-radius: 50%; background: var(--white); border: 1px solid var(--ink); }
.thread-content-wrap { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.thread-text { font-size: 15px; line-height: 1.6; white-space: pre-wrap; flex: 1; word-break: break-word; }
.thread-text a { color: #0066cc; text-decoration: underline; }
.thread-meta-row { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 4px; }
.thread-date { font-size: 11px; color: var(--muted); white-space: nowrap; }
/* 小灰笔 + 小灰叉 */
.thread-icon-btn { font-size: 13px; color: #bbb; cursor: pointer; display: none; padding: 0 2px; user-select: none; }
.thread-item:hover .thread-icon-btn { display: inline-block; }
/* 图片网格 */
.thread-imgs { display: grid; gap: 4px; margin-top: 8px; max-width: 340px; }
.thread-imgs.cols-1 { grid-template-columns: 1fr; }
.thread-imgs.cols-2 { grid-template-columns: repeat(2, 1fr); }
.thread-imgs.cols-3 { grid-template-columns: repeat(3, 1fr); }
.thread-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; display: block; }
.thread-imgs.cols-1 .thread-img { aspect-ratio: 4 / 3; }
/* 大图预览 */
#lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 9900; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: pan-y; }
#lightbox.hidden { display: none !important; }
.lightbox-track { display: flex; height: 100%; width: 100%; will-change: transform; }
.lightbox-slide { flex: 0 0 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
.lightbox-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; -webkit-user-drag: none; }
.lightbox-close { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.12); color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center; z-index: 2; }
.lightbox-dots { position: absolute; bottom: 24px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; z-index: 2; }
.lightbox-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.35); }
.lightbox-dots span.active { background: #fff; }
/* 分组 */
.group-section { margin-bottom: 10px; }
.group-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.group-name { font-size: 14px; font-weight: 700; color: var(--ink); }
.group-count { font-size: 12px; color: var(--muted); font-weight: 400; }
.group-del { font-size: 12px; color: #ccc; margin-left: 10px; cursor: pointer; }
.group-body { padding-top: 4px; }
.group-body .thread-item { margin-left: 0; }
.new-group-btn { font-size: 13px; color: var(--muted); padding: 10px 0; cursor: pointer; }
.add-to-group-btn { font-size: 12px; color: var(--muted); padding: 6px 0 2px 20px; cursor: pointer; }
.add-detail { position: relative; padding-left: 20px; border-left: 1px solid transparent; margin-left: 5px; }
.add-textarea { width: 100%; border: none; background: var(--soft); font-size: 15px; resize: none; padding: 15px; min-height: 80px; border-radius: 12px; margin-bottom: 10px; }
.add-actions { display: flex; justify-content: space-between; align-items: center; }
.add-img-btn { font-size: 24px; color: var(--muted); cursor: pointer; }
.add-submit { background: var(--ink); color: var(--white); padding: 6px 16px; border-radius: 15px; font-size: 14px; font-weight: 600; }
.fab { position: fixed; right: 20px; bottom: 40px; width: 56px; height: 56px; background: var(--ink); border-radius: 50%; z-index: 800; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; transition: transform 0.1s, left 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
.fab:active { cursor: grabbing; transform: scale(0.95); }
.fab svg { width: 24px; height: 24px; fill: none; stroke: var(--white); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fab.hidden { display: none !important; }
.popup-menu { position: absolute; top: 180px; left: 50%; transform: translateX(-50%); background: var(--white); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); z-index: 200; display: none; flex-direction: column; padding: 8px; width: 200px; }
.popup-menu.show { display: flex; }
.popup-menu button { text-align: left; padding: 12px 15px; font-size: 16px; border-radius: 8px; font-weight: 500; }
.popup-menu button:hover { background: var(--soft); }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999; white-space: nowrap; }
.toast.show { opacity: 1; }
.hidden { display: none !important; }
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 9500; display: flex; align-items: center; justify-content: center; }
.modal-content { background: #fff; padding: 30px; border-radius: 16px; width: 90%; max-width: 340px; text-align: center; }
.welcome-input { width: 100%; border: none; border-bottom: 1px solid var(--ink); font-size: 20px; text-align: center; padding: 10px; margin-bottom: 20px; background: transparent; font-weight: 700; }
.gender-select { display: flex; gap: 15px; margin-bottom: 30px; justify-content: center; }
.gender-btn { padding: 8px 20px; border: 1px solid var(--line); border-radius: 20px; font-size: 15px; color: var(--muted); transition: all 0.2s; }
.gender-btn.active { border-color: var(--ink); color: var(--ink); background: var(--soft); }

/* 左滑编辑/删除 */
.box-card .box-content { position: relative; z-index: 2; background: var(--white); transition: transform 0.25s ease; display: flex; justify-content: space-between; align-items: center; width: 100%; }
.box-card.swiped .box-content { transform: translateX(-160px); }
.box-card .box-swipe-actions { position: absolute; top: 0; right: 0; height: 100%; display: flex; transform: translateX(100%); transition: transform 0.25s ease; z-index: 3; }
.box-card.swiped .box-swipe-actions { transform: translateX(0); }
.box-swipe-edit, .box-swipe-delete { width: 80px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #fff; }
.box-swipe-edit { background: #555; }
.box-swipe-delete { background: var(--ink); }
</style>
</head>
<body>

<div id="welcomeIntro" class="hidden">
  <div class="intro-title" id="introTitle"></div>
  <div class="intro-tap" id="introTap">点击屏幕开始探索</div>
</div>

<div id="letterOverlay" class="hidden">
  <div class="letter-card">
    <h2>一封来信</h2>
    <p>这里是别处的世界，不在此处。</p>
    <p>可以把它当成平行宇宙。</p>
    <p>如梦幻泡影，如露亦如电。</p>
    <div class="letter-actions">
      <button class="letter-ok" id="letterOkBtn">我知道了</button>
    </div>
  </div>
</div>

<div id="welcomeOverlay" class="modal-overlay hidden">
  <div class="modal-content">
    <h2 style="margin-top:0;">欢迎来到别处</h2>
    <p style="color:var(--muted); font-size:14px; margin-bottom:20px;">这是一个脱离此刻的想象世界。</p>
    <input type="text" id="welcomeName" class="welcome-input" placeholder="你希望我如何称呼“你”？" maxlength="10">
    <div class="gender-select">
      <button class="gender-btn" data-g="男">男</button>
      <button class="gender-btn" data-g="女">女</button>
      <button class="gender-btn active" data-g="Ta">无性别</button>
    </div>
    <button class="add-submit" id="welcomeBtn" style="width:100%; padding:12px; font-size:16px;">进入世界</button>
  </div>
</div>

<div id="profileOverlay" class="modal-overlay hidden">
  <div class="modal-content">
    <h2 style="margin-top:0;">修改档案</h2>
    <input type="text" id="profileName" class="welcome-input" placeholder="你希望我如何称呼“你”？" maxlength="10">
    <div class="gender-select">
      <button class="gender-btn" data-g="男">男</button>
      <button class="gender-btn" data-g="女">女</button>
      <button class="gender-btn" data-g="Ta">无性别</button>
    </div>
    <button class="add-submit" id="saveProfileBtn" style="width:100%; padding:12px; font-size:16px;">保存修改</button>
  </div>
</div>

<div id="loader" class="hidden">
  <div class="book-wrap"><div class="book-3d"><div class="book-page"></div></div></div>
  <div class="loader-text">Life is Elsewhere</div>
</div>

<div id="calendarOverlay" class="hidden">
  <div class="cal-month-year" id="calMonth">OCTOBER 2026</div>
  <div class="cal-day" id="calDay">24</div>
  <div class="cal-festival" id="calFestival">宜记录，宜想象</div>
  <div class="cal-line"></div>
  <div class="cal-quote" id="calQuote">生活在别处。</div>
  <div class="cal-author" id="calAuthor">—— 米兰·昆德拉</div>
  <div class="cal-tap">轻触任意位置</div>
</div>

<div class="fab hidden" id="fabBtn">
  <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
</div>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">ELSEWHERE</div>
    <div class="top-actions">
      <button class="plain-btn" id="profileBtn">档案</button>
      <button class="plain-btn" id="exportBtn">导出</button>
      <button class="plain-btn" id="importBtn">导入</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </header>

  <nav class="main-tabs">
    <button class="main-tab active" data-view="diary">日记</button>
    <button class="main-tab" data-view="imagine">想象</button>
  </nav>

  <div id="diarySection">
    <div id="diarySubView">
      <div class="hero">
        <h1 id="greetingTitle">Ta在好好生活。</h1>
        <p>去过的地方，吃过的东西，走过的路，以及那些不必特别、但值得记下来的日子。</p>
      </div>
      
      <div class="stats">
        <div class="stat"><strong id="daysCount">0</strong><span>记录的日子</span></div>
        <div class="stat"><strong id="placesCount">0</strong><span>去过的地方</span></div>
        <div class="stat"><strong id="entriesCount">0</strong><span>留下的文字</span></div>
      </div>

      <input type="text" id="searchInput" class="search-bar" placeholder="搜索内容或日期">
      <div id="entriesList"></div>
    </div>

    <div id="writeSubView" class="hidden">
      <h2 id="formTitle" style="font-size:24px; margin-bottom:20px;">记下今天</h2>
      <form id="entryForm">
        <input type="hidden" id="entryId">
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="date" class="form-input" required>
        </div>

        <div class="mode-switch">
          <button type="button" class="mode-btn active" id="modeNormal">分栏填写</button>
          <button type="button" class="mode-btn" id="modeSmart">大段智能写</button>
        </div>

        <div id="normalInputs">
          <div class="form-group"><label>在哪里</label><input type="text" id="place" class="form-input" placeholder="家、公司、咖啡馆……"></div>
          <div class="form-group"><label>吃了什么</label><input type="text" id="food" class="form-input" placeholder="晚餐、甜点……"></div>
          <div class="form-group"><label>感觉</label><input type="text" id="mood" class="form-input" placeholder="平静、疲惫……"></div>
        </div>

        <div class="form-group">
          <label id="eventsLabel">发生了什么</label>
          <textarea id="events" class="form-textarea" placeholder="先随便写点什么……"></textarea>
        </div>

        <div style="display:flex; gap:10px;">
          <button type="submit" class="add-submit" style="padding:12px 24px; font-size:16px;">保存记录</button>
          <button type="button" class="plain-btn" id="backBtn" style="border:1px solid var(--line); border-radius:20px; padding:10px 20px;">返回</button>
        </div>
      </form>
    </div>
  </div>

  <div id="imagineSection" class="hidden">
    <div id="imagineHub">
      <div class="hero">
        <h1 id="imagineTitle">Ta的世界，不止现在。</h1>
        <p>在脑海中构建未来的居所、穿着、职业与爱好。把这些渴望收集起来。</p>
      </div>
      <div class="box-list" id="boxList"></div>
      <div class="add-box-btn" id="addBoxBtn">添加新想象</div>
    </div>

    <div id="boxDetail" class="hidden">
      <div class="box-header">
        <button class="back-btn" id="backToImagineHub">←</button>
        <input type="text" id="boxTitleInput" class="box-title-input" disabled>
        <span class="title-pencil" id="editBoxTitleBtn">✎</span>
      </div>
      
      <div class="core-imagine">
        <textarea id="coreInput" class="core-input" placeholder="写下这个盒子的核心想象……" rows="2"></textarea>
      </div>

      <div id="groupWrap"></div>
      <div class="thread-feed" id="threadFeed"></div>

      <div class="add-detail">
        <textarea id="detailText" class="add-textarea" placeholder="添砖加瓦……"></textarea>
        <div class="add-actions">
          <label class="add-img-btn">
            +
            <input type="file" id="detailImage" accept="image/*" multiple style="display:none;">
          </label>
          <button class="add-submit" id="addDetailBtn">发布</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="popup-menu" id="boxTypeMenu">
  <button data-type="房子">房子</button>
  <button data-type="衣柜">衣柜</button>
  <button data-type="职业">职业</button>
  <button data-type="爱好">爱好</button>
  <button data-type="远方">远方</button>
  <button data-type="创作">创作</button>
  <button data-type="custom">自定义……</button>
</div>

<div id="lightbox" class="hidden">
  <button class="lightbox-close" id="lightboxClose">×</button>
  <div class="lightbox-track" id="lightboxTrack"></div>
  <div class="lightbox-dots" id="lightboxDots"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var KEY_DIARY = 'herLittleAtlas.entries.v8';
  var KEY_IMAGINE = 'herLittleAtlas.imagine.v8';
  var KEY_PROFILE = 'herLittleAtlas.profile.v8';
  var KEY_ONBOARDED = 'herLittleAtlas.onboarded.v8';
  var KEY_CORE_TIP = 'herLittleAtlas.coreTip.v8';
  var $ = function(id) { return document.getElementById(id); };

  var entries = [];
  var imagineBoxes = [];
  var userProfile = { name: 'Ta', gender: 'Ta' };
  var currentBoxId = null;
  var currentSearchQuery = '';
  var currentMode = 'normal';
  var selectedGender = 'Ta';
  var introDone = false;

  var presetEntry = {
    id: 'e-preset-rain',
    date: '2026-10-23',
    place: '来书写我吧',
    food: '开心果蛋糕',
    mood: '安静',
    events: '下了一天的雨。早上给阳台的盆栽浇水，放了玉米在栏杆上，两只灰鸰小鸟来了又走。坐在落地窗前看雨后，回房间听着唱片写作、做瑜伽，。\n\n下午在淅沥雨声里午休到自然醒，醒来天色已暗。吃了一角开心果味的蛋糕，泡完脚上床读了会《不能承受的生命之轻》，读得昏昏沉沉又睡了过去。无比平常而安静的一天。\n\n另一个世界的你在看吗？\n删掉这条不属于你的日记，“你”的故事就可以开始了。'
  };

  var quotes = [
    { text: "生活在别处。", author: "—— 米兰·昆德拉" },
    { text: "去爱，去失去，去感受，去生活。", author: "—— 电影《时时刻刻》" },
    { text: "希望是本无所谓有，无所谓无的。这正如地上的路；其实地上本没有路，走的人多了，也便成了路。", author: "—— 鲁迅" },
    { text: "我们读诗写诗，并不是因为它们好玩，而是因为我们是人类的一份子。人类是充满激情的。", author: "—— 电影《死亡诗社》" },
    { text: "如果冬天来了，春天还会远吗？", author: "—— 雪莱" },
    { text: "对未来的真正慷慨，是把一切都献给现在。", author: "—— 加缪" }
  ];

  var boxPrompts = {
    '房子': '你理想中的房子在哪？户型多大？窗外是什么风景？',
    '衣柜': '你希望衣柜里装满什么样的衣服？极简还是复古？',
    '职业': '想象你未来的工作状态。你在做什么？给你带来什么感觉？',
    '爱好': '你想把时间花在什么事情上？想学什么新技能？',
    '远方': '你最想去哪座城市？那里有什么吸引你的？',
    '创作': '你想创作什么样的作品？画作、音乐、文字？',
    'default': '你想象中的它是什么样的呢？'
  };

  // ================= 初始化 =================
  window.addEventListener('load', function() {
    try {
      var d = localStorage.getItem(KEY_DIARY);
      entries = d ? JSON.parse(d) : [];
      var hasPreset = entries.some(function(e) { return e.id === 'e-preset-rain'; });
      if (!hasPreset) {
        entries.push(presetEntry);
        localStorage.setItem(KEY_DIARY, JSON.stringify(entries));
      }
      var p = localStorage.getItem(KEY_PROFILE);
      if (!p) {
        $('loader').style.display = 'none';
        $('welcomeOverlay').classList.remove('hidden');
        renderDiary();
        return;
      }
      userProfile = JSON.parse(p);
      var i = localStorage.getItem(KEY_IMAGINE);
      imagineBoxes = i ? JSON.parse(i) : [];
    } catch(e) { console.log(e); }
    startAppFlow();
  });

  // 首次欢迎
  document.querySelectorAll('#welcomeOverlay .gender-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#welcomeOverlay .gender-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      selectedGender = this.getAttribute('data-g');
    });
  });

  $('welcomeBtn').addEventListener('click', function() {
    var name = $('welcomeName').value.trim();
    if (!name) { showToast('请填写称呼'); return; }
    userProfile = { name: name, gender: selectedGender };
    localStorage.setItem(KEY_PROFILE, JSON.stringify(userProfile));
    $('welcomeOverlay').classList.add('hidden');
    // 档案之后 → 日历
    $('loader').style.display = 'flex';
    setTimeout(function() {
      $('loader').classList.add('fade-out');
      setTimeout(function() {
        $('loader').style.display = 'none';
        showCalendar();
      }, 600);
    }, 1000);
  });

  // 修改档案
  $('profileBtn').addEventListener('click', function() {
    $('profileName').value = userProfile.name;
    document.querySelectorAll('#profileOverlay .gender-btn').forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-g') === userProfile.gender);
    });
    selectedGender = userProfile.gender;
    $('profileOverlay').classList.remove('hidden');
  });

  document.querySelectorAll('#profileOverlay .gender-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#profileOverlay .gender-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      selectedGender = this.getAttribute('data-g');
    });
  });

  $('saveProfileBtn').addEventListener('click', function() {
    var name = $('profileName').value.trim();
    if (!name) { showToast('请填写称呼'); return; }
    userProfile = { name: name, gender: selectedGender };
    localStorage.setItem(KEY_PROFILE, JSON.stringify(userProfile));
    $('profileOverlay').classList.add('hidden');
    updatePronouns();
    showToast('档案已更新');
  });

  function updatePronouns() {
    var pronoun = userProfile.gender === 'Ta' ? 'Ta' : userProfile.gender;
    var displayName = userProfile.name || pronoun;
    $('greetingTitle').textContent = displayName + '在好好生活。';
    $('imagineTitle').textContent = displayName + '的世界，不止现在。';
  }

  // ================= 开场流程 =================
  function startAppFlow() {
    updatePronouns();
    var onboarded = localStorage.getItem(KEY_ONBOARDED);
    if (!onboarded) {
      playIntro();
    } else {
      showLoaderThenCalendar();
    }
  }

  function playIntro() {
    $('loader').style.display = 'none';
    var intro = $('welcomeIntro');
    intro.classList.remove('hidden');
    var fullText = '欢迎来到别处世界';
    var titleEl = $('introTitle');
    var i = 0;
    titleEl.innerHTML = '<span class="cursor"></span>';
    function typeNext() {
      if (i < fullText.length) {
        var ch = fullText.charAt(i);
        var cursor = titleEl.querySelector('.cursor');
        cursor.insertAdjacentText('beforebegin', ch);
        i++;
        setTimeout(typeNext, 120 + Math.random() * 180);
      } else {
        var cursor = titleEl.querySelector('.cursor');
        setTimeout(function() { if (cursor) cursor.remove(); }, 800);
        $('introTap').classList.add('show');
        introDone = true;
      }
    }
    setTimeout(typeNext, 400);
    intro.addEventListener('click', function() {
      if (!introDone) return;
      intro.classList.add('fade-out');
      setTimeout(function() {
        intro.classList.add('hidden');
        showLetter();
      }, 600);
    });
  }

  function showLetter() {
    var letter = $('letterOverlay');
    letter.classList.remove('hidden');
    $('letterOkBtn').onclick = function() {
      localStorage.setItem(KEY_ONBOARDED, '1');
      letter.classList.add('fade-out');
      setTimeout(function() {
        letter.classList.add('hidden');
        $('welcomeOverlay').classList.remove('hidden');
      }, 500);
    };
  }

  function showLoaderThenCalendar() {
    $('loader').style.display = 'flex';
    $('loader').classList.remove('fade-out');
    setTimeout(function() {
      $('loader').classList.add('fade-out');
      setTimeout(function() {
        $('loader').style.display = 'none';
        showCalendar();
      }, 600);
    }, 1200);
  }

  // ================= 日历过渡 =================
  function showCalendar() {
    var d = new Date();
    var months = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
    $('calMonth').textContent = months[d.getMonth()] + " " + d.getFullYear();
    $('calDay').textContent = d.getDate();
    var m = d.getMonth() + 1;
    var day = d.getDate();
    var festival = "宜记录，宜想象";
    if (m === 10 && day === 24) festival = "霜降";
    if (m === 1 && day === 1) festival = "元旦";
    $('calFestival').textContent = festival;
    var q = quotes[Math.floor(Math.random() * quotes.length)];
    $('calQuote').textContent = q.text;
    $('calAuthor').textContent = q.author;
    var overlay = $('calendarOverlay');
    overlay.classList.remove('hidden');
    overlay.addEventListener('click', function() {
      overlay.classList.add('fade-out');
      setTimeout(function() {
        overlay.classList.add('hidden');
        $('app').classList.add('loaded');
        window.scrollTo(0, 0);
        updateFabVisibility();
        renderDiary();
      }, 1000);
    }, { once: true });
  }

  // ================= 数据保存 =================
  function saveDiary() { localStorage.setItem(KEY_DIARY, JSON.stringify(entries)); }
  function saveImagine() { localStorage.setItem(KEY_IMAGINE, JSON.stringify(imagineBoxes)); }
  var toastTimer = null;
  function showToast(t) {
    var el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2000);
  }

  // ================= 链接封装 =================
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function linkify(text) {
    var safe = escapeHtml(text);
    var urlRe = /(https?:\/\/[^\s<]+|www\.[^\s<]+)/g;
    return safe.replace(urlRe, function(u) {
      var href = u.indexOf('http') === 0 ? u : ('https://' + u);
      return '<a href="' + href + '" target="_blank" rel="noopener">' + u + '</a>';
    });
  }

  // ================= 页面切换 =================
  document.querySelectorAll('.main-tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      if (this.getAttribute('data-view') === 'diary') {
        $('diarySection').classList.remove('hidden');
        $('imagineSection').classList.add('hidden');
        updateFabVisibility();
      } else {
        $('diarySection').classList.add('hidden');
        $('imagineSection').classList.remove('hidden');
        updateFabVisibility();
        backToImagineHub();
      }
    });
  });

  function updateFabVisibility() {
    var isDiary = !$('diarySection').classList.contains('hidden');
    var inWrite = !$('writeSubView').classList.contains('hidden');
    var inBoxDetail = !$('boxDetail').classList.contains('hidden');
    if (isDiary && !inWrite) $('fabBtn').classList.remove('hidden');
    else $('fabBtn').classList.add('hidden');
  }

  // ================= 日记渲染 =================
  function formatDate(s) {
    if (!s) return '';
    var d = new Date(s + 'T12:00:00');
    return d.toLocaleDateString('zh-CN', {year:'numeric', month:'long', day:'numeric'});
  }

  function renderDiary() {
    $('daysCount').textContent = entries.length;
    $('entriesCount').textContent = entries.length;
    var places = new Set();
    entries.forEach(e => {
      if (e.place) e.place.split(/[·，,、]/).forEach(x => { if(x.trim()) places.add(x.trim()); });
    });
    $('placesCount').textContent = places.size;

    var filtered = entries.filter(function(e) {
      if (!currentSearchQuery) return true;
      var str = (e.date + ' ' + (e.place||'') + ' ' + (e.food||'') + ' ' + (e.mood||'') + ' ' + (e.events||'')).toLowerCase();
      return str.indexOf(currentSearchQuery) > -1;
    });
    filtered.sort((a,b) => b.date.localeCompare(a.date));

    var html = filtered.map(function(e) {
      var tags = '';
      if (e.food) tags += '<span class="tag">吃了 · ' + e.food + '</span>';
      if (e.mood) tags += '<span class="tag">感觉 · ' + e.mood + '</span>';
      return '<div class="entry">'
        + '<div class="entry-date">' + formatDate(e.date) + '</div>'
        + '<div class="entry-place">' + escapeHtml(e.place || '无题') + '</div>'
        + (tags ? '<div class="entry-tags">' + tags + '</div>' : '')
        + '<div class="entry-body">' + linkify(e.events || '') + '</div>'
        + '<div class="entry-actions">'
        + '<button onclick="editEntry(\'' + e.id + '\')">编辑</button>'
        + '<button onclick="deleteEntry(\'' + e.id + '\')">删除</button>'
        + '</div></div>';
    }).join('');

    if (!html) html = '<div style="padding:40px 0; color:var(--muted); text-align:center; line-height:2;">这里还空着。<br>点右下角，写下第一个“别处”的今天。</div>';
    $('entriesList').innerHTML = html;
    updateFabVisibility();
  }

  $('searchInput').addEventListener('input', function(e) {
    currentSearchQuery = e.target.value.toLowerCase().trim();
    renderDiary();
  });

  $('fabBtn').addEventListener('click', function() {
    $('entryForm').reset();
    $('entryId').value = '';
    $('date').value = new Date().toISOString().split('T')[0];
    $('formTitle').textContent = '记下今天';
    $('diarySubView').classList.add('hidden');
    $('writeSubView').classList.remove('hidden');
    updateFabVisibility();
  });

  $('backBtn').addEventListener('click', function() {
    $('writeSubView').classList.add('hidden');
    $('diarySubView').classList.remove('hidden');
    updateFabVisibility();
  });

  function parseSmartText(text, currentObj) {
    if (!text.trim()) return currentObj;
    var lines = text.split('\n');
    var parsedPlace = currentObj.place; var parsedFood = currentObj.food; var parsedMood = currentObj.mood;
    var remainingLines = [];
    lines.forEach(line => {
      let trimmed = line.trim();
      if (!trimmed) return;
      if (!parsedPlace && (trimmed.includes('去了') || trimmed.includes('在') || trimmed.includes('到了'))) {
        let match = trimmed.match(/(去了|在|到了)([\u4e00-\u9fa5A-Za-z0-9·]{2,10})/);
        if (match && match[2]) { parsedPlace = match[2]; remainingLines.push(trimmed.replace(match[0], '')); return; }
      }
      if (!parsedFood && (trimmed.includes('吃了') || trimmed.includes('喝了') || trimmed.includes('点了'))) {
        let match = trimmed.match(/(吃了|喝了|点了)([\u4e00-\u9fa5A-Za-z0-9·]{2,10})/);
        if (match && match[2]) { parsedFood = match[2]; remainingLines.push(trimmed.replace(match[0], '')); return; }
      }
      if (!parsedMood && (trimmed.includes('感觉') || trimmed.includes('开心') || trimmed.includes('安静') || trimmed.includes('微醺'))) {
        let match = trimmed.match(/(感觉|觉得)([\u4e00-\u9fa5A-Za-z0-9·]{2,10})/);
        if (match && match[2]) { parsedMood = match[2]; remainingLines.push(trimmed.replace(match[0], '')); return; }
      }
      remainingLines.push(trimmed);
    });
    return { place: parsedPlace, food: parsedFood, mood: parsedMood, events: remainingLines.join('\n').trim() || text };
  }

  $('entryForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var id = $('entryId').value || ('e-' + Date.now());
    var finalPlace = $('place').value.trim();
    var finalFood = $('food').value.trim();
    var finalMood = $('mood').value.trim();
    var finalEvents = $('events').value.trim();
    if (currentMode === 'smart') {
      var parsed = parseSmartText(finalEvents, {place: finalPlace, food: finalFood, mood: finalMood});
      finalPlace = parsed.place || ''; finalFood = parsed.food || ''; finalMood = parsed.mood || ''; finalEvents = parsed.events;
    }
    var obj = { id: id, date: $('date').value, place: finalPlace, food: finalFood, mood: finalMood, events: finalEvents };
    var idx = entries.findIndex(x => x.id === id);
    if (idx > -1) entries[idx] = obj; else entries.push(obj);
    saveDiary(); renderDiary();
    $('backBtn').click();
    showToast('保存成功');
  });

  window.editEntry = function(id) {
    var e = entries.find(x => x.id === id);
    if (!e) return;
    $('entryId').value = e.id;
    $('date').value = e.date;
    $('place').value = e.place || '';
    $('food').value = e.food || '';
    $('mood').value = e.mood || '';
    $('events').value = e.events || '';
    $('formTitle').textContent = '编辑记录';
    $('diarySubView').classList.add('hidden');
    $('writeSubView').classList.remove('hidden');
    switchMode('normal');
    updateFabVisibility();
  };

  window.deleteEntry = function(id) {
    if (!confirm('确定删除吗？')) return;
    entries = entries.filter(x => x.id !== id);
    saveDiary(); renderDiary();
  };

  function switchMode(mode) {
    currentMode = mode;
    if (mode === 'normal') {
      $('modeNormal').classList.add('active');
      $('modeSmart').classList.remove('active');
      $('normalInputs').style.display = 'block';
      $('eventsLabel').textContent = '发生了什么';
      $('events').placeholder = '先随便写点什么……';
    } else {
      $('modeNormal').classList.remove('active');
      $('modeSmart').classList.add('active');
      $('normalInputs').style.display = 'none';
      $('eventsLabel').textContent = '大段记录';
      $('events').placeholder = '在这里写下或者粘贴一大段话，保存时会自动拆分……';
    }
  }
  $('modeNormal').addEventListener('click', () => switchMode('normal'));
  $('modeSmart').addEventListener('click', () => switchMode('smart'));

  // ================= 想象渲染 =================
  function renderHub() {
    var html = imagineBoxes.map(function(box) {
      return '<div class="box-card" data-id="' + box.id + '">'
        + '<div class="box-content">'
        + '<div onclick="openBox(\'' + box.id + '\')" style="flex:1;">'
        + '<div class="box-title">' + escapeHtml(box.name) + '</div>'
        + '<div class="box-desc">' + (box.details ? box.details.length : 0) + ' 条补充</div>'
        + '</div>'
        + '<div onclick="openBox(\'' + box.id + '\')" style="font-size:22px; color:#ccc; padding-right:6px;">›</div>'
        + '</div>'
        + '<div class="box-swipe-actions">'
        + '<div class="box-swipe-edit" onclick="editBoxName(\'' + box.id + '\', event)">编辑</div>'
        + '<div class="box-swipe-delete" onclick="deleteBox(\'' + box.id + '\', event)">删除</div>'
        + '</div>'
        + '</div>';
    }).join('');
    $('boxList').innerHTML = html;
    bindBoxSwipe();
  }

  function bindBoxSwipe() {
    document.querySelectorAll('.box-card').forEach(function(card) {
      var startX = 0, startY = 0, isSwiping = false;
      card.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isSwiping = false;
      }, { passive: true });
      card.addEventListener('touchmove', function(e) {
        var dx = e.touches[0].clientX - startX;
        var dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) > Math.abs(dy) && dx < -10) isSwiping = true;
        if (card.classList.contains('swiped') && dx > 10) {
          card.classList.remove('swiped');
          isSwiping = false;
        }
      }, { passive: true });
      card.addEventListener('touchend', function() {
        if (isSwiping) { card.classList.add('swiped'); isSwiping = false; }
      });
      card.addEventListener('click', function(e) {
        if (card.classList.contains('swiped') && !e.target.closest('.box-swipe-actions')) {
          card.classList.remove('swiped');
        }
      });
    });
  }

  window.editBoxName = function(id, event) {
    if (event) event.stopPropagation();
    var box = imagineBoxes.find(x => x.id === id);
    if (!box) return;
    var newName = prompt('修改盒子名称：', box.name);
    if (newName !== null && newName.trim() !== '') {
      box.name = newName.trim();
      saveImagine();
      renderHub();
    }
  };

  window.deleteBox = function(id, event) {
    if (event) event.stopPropagation();
    if (!confirm('确定删除这个盒子吗？里面的内容也会一并删除。')) return;
    imagineBoxes = imagineBoxes.filter(x => x.id !== id);
    saveImagine();
    renderHub();
    showToast('已删除');
  };

  window.openBox = function(id) {
    currentBoxId = id;
    var box = imagineBoxes.find(x => x.id === id);
    if (!box) return;
    document.querySelectorAll('.box-card.swiped').forEach(function(c) { c.classList.remove('swiped'); });
    $('imagineHub').classList.add('hidden');
    $('boxDetail').classList.remove('hidden');
    $('boxTitleInput').value = box.name;
    $('boxTitleInput').disabled = true;
    $('coreInput').value = box.core || '';
    var prompt = boxPrompts[box.name] || boxPrompts['default'];
    $('coreInput').placeholder = prompt;
    if (!box.groups) box.groups = [];
    renderBoxDetail(box);
    updateFabVisibility();
    maybeShowCoreTip();
  };

  function maybeShowCoreTip() {
    if (localStorage.getItem(KEY_CORE_TIP)) return;
    var el = document.createElement('div');
    el.className = 'core-bubble';
    el.textContent = '这里是核心想象，点一下就能写';
    var wrap = document.querySelector('.core-imagine');
    wrap.appendChild(el);
    var hide = function() {
      if (el.parentNode) el.parentNode.removeChild(el);
      localStorage.setItem(KEY_CORE_TIP, '1');
      document.removeEventListener('click', hide);
    };
    setTimeout(function() { document.addEventListener('click', hide); }, 100);
  }

  function renderBoxDetail(box) {
    renderGroups(box);
    $('threadFeed').innerHTML = renderUngroupedThreads(box);
    bindThreadActions();
  }

  function threadItemHtml(item, index, prefix) {
    var dateStr = item.date ? item.date.split('T')[0].replace(/-/g, '年').replace(/(\d+)月/, '$1月') + '日' : '';
    var imgHtml = '';
    if (item.images && item.images.length) {
      imgHtml = '<div class="thread-imgs cols-' + Math.min(item.images.length, 3) + '">';
      item.images.forEach(function(src, i) {
        imgHtml += '<img src="' + src + '" class="thread-img" onclick="openLightbox(\'' + prefix + '\',' + index + ',' + i + ')">';
      });
      imgHtml += '</div>';
    } else if (item.image) {
      imgHtml = '<div class="thread-imgs cols-1"><img src="' + item.image + '" class="thread-img" onclick="openLightbox(\'' + prefix + '\',' + index + ',0)"></div>';
    }
    return '<div class="thread-item">'
      + '<div class="thread-content-wrap"><div class="thread-text">' + linkify(item.text || '') + '</div></div>'
      + '<div class="thread-meta-row">'
      + '<span class="thread-date">' + dateStr + '</span>'
      + '<span class="thread-icon-btn" onclick="editThread(\'' + prefix + '\',' + index + ')">✎</span>'
      + '<span class="thread-icon-btn" onclick="delThread(\'' + prefix + '\',' + index + ')">×</span>'
      + '</div>'
      + imgHtml
      + '</div>';
  }

  function renderUngroupedThreads(box) {
    if (!box.details || !box.details.length) return '';
    return box.details.map(function(item, i) { return threadItemHtml(item, i, 'flat'); }).join('');
  }

  function renderGroups(box) {
    if (!box.groups) box.groups = [];
    var html = '';
    box.groups.forEach(function(g, gi) {
      html += '<div class="group-section" data-gi="' + gi + '">'
        + '<div class="group-head" onclick="toggleGroup(' + gi + ')">'
        + '<span class="group-name">' + escapeHtml(g.name) + ' <span class="group-count">(' + (g.threads ? g.threads.length : 0) + ')</span></span>'
        + '<span class="group-del" onclick="delGroup(' + gi + ', event)">删除</span>'
        + '</div>'
        + '<div class="group-body" id="groupBody' + gi + '">'
        + (g.threads || []).map(function(item, i) { return threadItemHtml(item, i, 'g' + gi); }).join('')
        + '<div class="add-to-group-btn" onclick="addToGroup(' + gi + ')">+ 加到这一组</div>'
        + '</div></div>';
    });
    html += '<div class="new-group-btn" onclick="addGroup()">+ 新建分组</div>';
    $('groupWrap').innerHTML = html;
  }

  window.toggleGroup = function(gi) {
    var body = $('groupBody' + gi);
    if (!body) return;
    body.style.display = body.style.display === 'none' ? 'block' : 'none';
  };

  window.addGroup = function() {
    var name = prompt('分组名称：');
    if (!name || !name.trim()) return;
    var box = imagineBoxes.find(x => x.id === currentBoxId);
    if (!box) return;
    if (!box.groups) box.groups = [];
    box.groups.push({ name: name.trim(), threads: [] });
    saveImagine();
    renderBoxDetail(box);
  };

  window.delGroup = function(gi, event) {
    if (event) event.stopPropagation();
    var box = imagineBoxes.find(x => x.id === currentBoxId);
    if (!box || !box.groups) return;
    var g = box.groups[gi];
    if (!confirm('删除分组「' + g.name + '」？组内 ' + (g.threads ? g.threads.length : 0) + ' 条补充也会一并删除。')) return;
    box.groups.splice(gi, 1);
    saveImagine();
    renderBoxDetail(box);
  };

  // 方案 A：把当前输入框内容加到指定分组
  window.addToGroup = function(gi) {
    var box = imagineBoxes.find(x => x.id === currentBoxId);
    if (!box || !box.groups || !box.groups[gi]) return;
    var text = $('detailText').value.trim();
    var files = Array.prototype.slice.call($('detailImage').files || []);
    if (!text && !files.length) { showToast('先写点什么或选张图'); return; }
    if (files.length > 6) { showToast('最多一次 6 张图片'); files = files.slice(0, 6); }
    processImages(files, function(images) {
      var now = new Date();
      var dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
      box.groups[gi].threads.push({ text: text, images: images, date: dateStr });
      saveImagine();
      $('detailText').value = '';
      $('detailImage').value = '';
      renderBoxDetail(box);
    });
  };

  function processImages(files, cb) {
    if (!files.length) { cb([]); return; }
    var results = new Array(files.length);
    var loaded = 0;
    files.forEach(function(file, idx) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var scale = Math.min(1, 800 / Math.max(img.width, img.height));
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          results[idx] = canvas.toDataURL('image/jpeg', 0.7);
          loaded++;
          if (loaded === files.length) cb(results.filter(Boolean));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function bindThreadActions() {}

  function findThread(prefix, index) {
    var box = imagineBoxes.find(x => x.id === currentBoxId);
    if (!box) return null;
    if (prefix === 'flat') return { box: box, list: box.details, index: index, item: box.details[index] };
    var gi = parseInt(prefix.replace('g', ''), 10);
    if (!box.groups || !box.groups[gi]) return null;
    return { box: box, list: box.groups[gi].threads, index: index, item: box.groups[gi].threads[index] };
  }

  window.editThread = function(prefix, index) {
    var t = findThread(prefix, index);
    if (!t) return;
    var newText = prompt('修改内容：', t.item.text);
    if (newText !== null) {
      t.item.text = newText.trim();
      saveImagine();
      renderBoxDetail(t.box);
    }
  };

  window.delThread = function(prefix, index) {
    if (!confirm('删除这条补充吗？')) return;
    var t = findThread(prefix, index);
    if (!t) return;
    t.list.splice(index, 1);
    saveImagine();
    renderBoxDetail(t.box);
  };

  // ================= 大图预览（修复滑动卡住） =================
  var lightboxImages = [];
  var lightboxIndex = 0;
  window.openLightbox = function(prefix, index, imgIndex) {
    var t = findThread(prefix, index);
    if (!t) return;
    var item = t.item;
    lightboxImages = item.images && item.images.length ? item.images.slice() : (item.image ? [item.image] : []);
    if (!lightboxImages.length) return;
    lightboxIndex = imgIndex || 0;
    renderLightbox();
    $('lightbox').classList.remove('hidden');
  };

  function renderLightbox() {
    var track = $('lightboxTrack');
    track.innerHTML = lightboxImages.map(function(src) {
      return '<div class="lightbox-slide"><img src="' + src + '"></div>';
    }).join('');
    var dots = $('lightboxDots');
    dots.innerHTML = lightboxImages.map(function(_, i) {
      return '<span class="' + (i === lightboxIndex ? 'active' : '') + '"></span>';
    }).join('');
    track.style.transition = 'none';
    track.style.transform = 'translateX(' + (-lightboxIndex * 100) + '%)';
  }

  function setLightboxIndex(idx, animate) {
    lightboxIndex = Math.max(0, Math.min(idx, lightboxImages.length - 1));
    var track = $('lightboxTrack');
    if (animate) track.style.transition = 'transform 0.25s ease';
    else track.style.transition = 'none';
    track.style.transform = 'translateX(' + (-lightboxIndex * 100) + '%)';
    var dots = $('lightboxDots').children;
    for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('active', i === lightboxIndex);
  }

  $('lightboxClose').addEventListener('click', function() {
    $('lightbox').classList.add('hidden');
  });

  (function bindLightboxSwipe() {
    var track = $('lightboxTrack');
    var startX = 0, startY = 0, lastX = 0, dragging = false, moved = false;
    track.addEventListener('touchstart', function(e) {
      if (e.touches.length !== 1) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      lastX = startX;
      dragging = true;
      moved = false;
      track.style.transition = 'none';
    }, { passive: true });
    track.addEventListener('touchmove', function(e) {
      if (!dragging || e.touches.length !== 1) return;
      var x = e.touches[0].clientX;
      var dx = x - startX;
      lastX = x;
      if (Math.abs(dx) > 8) moved = true;
      track.style.transform = 'translateX(calc(' + (-lightboxIndex * 100) + '% + ' + dx + 'px))';
    }, { passive: true });
    track.addEventListener('touchend', function(e) {
      if (!dragging) return;
      dragging = false;
      var dx = lastX - startX;
      if (Math.abs(dx) > 50) {
        if (dx < 0) setLightboxIndex(lightboxIndex + 1, true);
        else setLightboxIndex(lightboxIndex - 1, true);
      } else {
        setLightboxIndex(lightboxIndex, true);
      }
    });
  })();

  $('coreInput').addEventListener('blur', function() {
    var box = imagineBoxes.find(x => x.id === currentBoxId);
    if (box) { box.core = this.value; saveImagine(); }
  });

  $('addDetailBtn').addEventListener('click', function() {
    var box = imagineBoxes.find(x => x.id === currentBoxId);
    if (!box) return;
    var text = $('detailText').value.trim();
    var files = Array.prototype.slice.call($('detailImage').files || []);
    if (!text && !files.length) return;
    if (files.length > 6) { showToast('最多一次 6 张图片'); files = files.slice(0, 6); }
    processImages(files, function(images) {
      var now = new Date();
      var dateStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
      if (!box.details) box.details = [];
      box.details.push({ text: text, images: images, date: dateStr });
      saveImagine();
      $('detailText').value = '';
      $('detailImage').value = '';
      renderBoxDetail(box);
    });
  });

  $('editBoxTitleBtn').addEventListener('click', function() {
    $('boxTitleInput').disabled = false;
    $('boxTitleInput').focus();
  });

  $('boxTitleInput').addEventListener('blur', function() {
    var box = imagineBoxes.find(x => x.id === currentBoxId);
    if (box) {
      box.name = this.value.trim() || box.name;
      this.value = box.name;
      saveImagine();
      this.disabled = true;
    }
  });

  $('backToImagineHub').addEventListener('click', backToImagineHub);
  function backToImagineHub() {
    $('boxDetail').classList.add('hidden');
    $('imagineHub').classList.remove('hidden');
    document.querySelectorAll('.box-card.swiped').forEach(function(c) { c.classList.remove('swiped'); });
    renderHub();
    updateFabVisibility();
  }

  $('addBoxBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    $('boxTypeMenu').classList.toggle('show');
  });

  document.querySelectorAll('#boxTypeMenu button').forEach(btn => {
    btn.addEventListener('click', function() {
      var type = this.getAttribute('data-type');
      var boxName = type;
      if (type === 'custom') boxName = '自定义';
      if (imagineBoxes.find(x => x.name === boxName)) {
        showToast('这个盒子已经有了');
        $('boxTypeMenu').classList.remove('show');
        return;
      }
      var newBox = { id: 'box-' + Date.now(), type: type, name: boxName, core: '', details: [], groups: [] };
      imagineBoxes.push(newBox);
      saveImagine();
      $('boxTypeMenu').classList.remove('show');
      renderHub();
      openBox(newBox.id);
    });
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('#addBoxBtn') && !e.target.closest('#boxTypeMenu')) {
      $('boxTypeMenu').classList.remove('show');
    }
  });

  // ================= 导入导出 =================
  $('exportBtn').addEventListener('click', function() {
    var data = { profile: userProfile, diary: entries, imagine: imagineBoxes };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '生活在别处_备份.json';
    a.click();
    showToast('导出成功');
  });

  $('importBtn').addEventListener('click', function() {
    $('importFile').click();
  });

  $('importFile').addEventListener('change', function(e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(ev) {
      try {
        var data = JSON.parse(ev.target.result);
        if (confirm('导入将覆盖当前所有数据，确定吗？')) {
          if (data.profile) {
            userProfile = data.profile;
            localStorage.setItem(KEY_PROFILE, JSON.stringify(userProfile));
          }
          if (data.diary) entries = data.diary;
          else if (Array.isArray(data)) entries = data;
          if (data.imagine) imagineBoxes = data.imagine;
          saveDiary(); saveImagine();
          showToast('导入成功，即将刷新');
          setTimeout(() => location.reload(), 1500);
        }
      } catch(err) { showToast('文件格式错误'); }
      e.target.value = '';
    };
    r.readAsText(f);
  });

  // ================= 拖拽悬浮球 =================
  var fab = $('fabBtn');
  var isDragging = false;
  var startX, startY, startLeft, startTop;

  fab.addEventListener('touchstart', startDrag, {passive: false});
  fab.addEventListener('mousedown', startDrag);

  function startDrag(e) {
    isDragging = false;
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    var rect = fab.getBoundingClientRect();
    startX = clientX; startY = clientY;
    startLeft = rect.left; startTop = rect.top;
    document.addEventListener('touchmove', onDrag, {passive: false});
    document.addEventListener('touchend', endDrag);
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
  }

  function onDrag(e) {
    if (!startX) return;
    e.preventDefault();
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    var dx = clientX - startX;
    var dy = clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isDragging = true;
    fab.style.left = (startLeft + dx) + 'px';
    fab.style.top = (startTop + dy) + 'px';
    fab.style.right = 'auto';
    fab.style.bottom = 'auto';
  }

  function endDrag() {
    document.removeEventListener('touchmove', onDrag);
    document.removeEventListener('touchend', endDrag);
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', endDrag);
    startX = null;
    var rect = fab.getBoundingClientRect();
    var vw = window.innerWidth;
    var targetLeft = rect.left + rect.width/2 > vw/2 ? vw - rect.width - 20 : 20;
    fab.style.left = targetLeft + 'px';
    fab.style.top = Math.max(20, Math.min(rect.top, window.innerHeight - rect.height - 20)) + 'px';
  }

  fab.addEventListener('click', function(e) {
    if (isDragging) { e.preventDefault(); e.stopPropagation(); }
  }, true);

})();
</script>
</body>
</html>
